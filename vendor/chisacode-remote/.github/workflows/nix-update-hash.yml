name: Nix Update Hash

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-hash:
    runs-on: ubuntu-latest
    env:
      CHISACODE_BOT_APP_ID: ${{ secrets.CHISACODE_BOT_APP_ID }}
      CHISACODE_BOT_APP_PRIVATE_KEY: ${{ secrets.CHISACODE_BOT_APP_PRIVATE_KEY }}
    steps:
      - uses: actions/create-github-app-token@v1
        id: app-token
        if: env.CHISACODE_BOT_APP_ID != '' && env.CHISACODE_BOT_APP_PRIVATE_KEY != ''
        with:
          app-id: ${{ env.CHISACODE_BOT_APP_ID }}
          private-key: ${{ env.CHISACODE_BOT_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          token: ${{ steps.app-token.outputs.token || github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Update lockfile + Nix hash if stale
        run: ./scripts/update-nix.sh

      - name: Build Nix package
        run: nix build .#default -o result

      - name: Commit hash/lockfile updates
        run: |
          git diff --quiet package-lock.json nix/npm-deps.hash && exit 0
          git config user.name "chisacode-ai[bot]"
          git config user.email "266920839+chisacode-ai[bot]@users.noreply.github.com"
          git add package-lock.json nix/npm-deps.hash
          git commit -m "fix: update lockfile signatures and Nix hash [skip ci]"
          git push
