name: Nix

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Update lockfile + Nix hash if stale
        run: ./scripts/update-nix.sh

      - name: Build Nix package
        run: nix build .#default -o result

      - name: Smoke Nix daemon
        run: |
          set -euo pipefail

          export CHISACODE_HOME
          CHISACODE_HOME="$(mktemp -d)"
          export CHISACODE_LISTEN=127.0.0.1:6767

          WRAPPER_LOG="$CHISACODE_HOME/chisacode-server-wrapper.log"

          cleanup() {
            if [[ -n "${DAEMON_PID:-}" ]] && kill -0 "$DAEMON_PID" 2>/dev/null; then
              kill "$DAEMON_PID"
              wait "$DAEMON_PID" || true
            fi
            rm -rf "$CHISACODE_HOME"
          }
          trap cleanup EXIT

          ./result/bin/chisacode-server --no-relay >"$WRAPPER_LOG" 2>&1 &
          DAEMON_PID=$!

          deadline=$((SECONDS + 30))
          while (( SECONDS < deadline )); do
            if STATUS_JSON="$(./result/bin/chisacode daemon status --json)" \
              && jq -e '.connectedDaemon == "reachable"' <<<"$STATUS_JSON" >/dev/null; then
              echo "$STATUS_JSON"
              exit 0
            fi

            if ! kill -0 "$DAEMON_PID" 2>/dev/null; then
              echo "Nix daemon exited before becoming reachable."
              break
            fi

            sleep 1
          done

          echo "::group::daemon.log"
          cat "$CHISACODE_HOME/daemon.log" 2>/dev/null || echo "<missing>"
          echo "::endgroup::"

          echo "::group::chisacode-server stdout/stderr"
          cat "$WRAPPER_LOG" 2>/dev/null || echo "<missing>"
          echo "::endgroup::"

          echo "::group::chisacode daemon status"
          ./result/bin/chisacode daemon status || true
          echo "::endgroup::"

          exit 1

      - name: Build Nix desktop package
        run: nix build .#desktop -o result-desktop
