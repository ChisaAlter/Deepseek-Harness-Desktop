name: Deploy Relay

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --workspace=@chisacode/relay --include-workspace-root

      - name: Typecheck
        run: npm run typecheck --workspace=@chisacode/relay

      - name: Security audit before deploy
        run: npm audit --audit-level=critical

      - name: Deploy worker
        run: cd packages/relay && npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
