<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>鹈鹕骑自行车 · SVG 动画</title>
    <style>
      :root {
        --sky-top: #7ec8e3;
        --sky-bottom: #d7f0ff;
        --ground: #7cb342;
        --ground-dark: #558b2f;
        --road: #5d5d5d;
        --road-line: #f5f5f5;
        --sun: #ffd54f;
        --text: #1a2b3c;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at 20% 20%, #ffffff55, transparent 40%),
          linear-gradient(180deg, var(--sky-top), var(--sky-bottom) 55%, #b8e986 55%, var(--ground));
        overflow: hidden;
      }

      .stage {
        width: min(960px, 96vw);
        padding: 20px 20px 28px;
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.35);
        backdrop-filter: blur(8px);
        box-shadow:
          0 20px 50px rgba(20, 50, 80, 0.18),
          inset 0 1px 0 rgba(255, 255, 255, 0.55);
      }

      h1 {
        margin: 0 0 8px;
        font-size: clamp(1.2rem, 2.5vw, 1.7rem);
        letter-spacing: 0.04em;
        text-align: center;
      }

      p {
        margin: 0 0 16px;
        text-align: center;
        opacity: 0.75;
        font-size: 0.95rem;
      }

      .canvas {
        width: 100%;
        aspect-ratio: 16 / 9;
        border-radius: 18px;
        overflow: hidden;
        background: linear-gradient(180deg, #87ceeb 0%, #c9ecff 58%, #8bc34a 58%, #689f38 100%);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.35);
      }

      svg {
        width: 100%;
        height: 100%;
        display: block;
      }

      /* Scene motion */
      .cloud {
        animation: drift 28s linear infinite;
      }

      .cloud.slow {
        animation-duration: 42s;
      }

      .cloud.fast {
        animation-duration: 18s;
      }

      .sun-glow {
        transform-origin: 120px 90px;
        animation: sunPulse 4s ease-in-out infinite;
      }

      .rider {
        transform-box: fill-box;
        transform-origin: center;
        animation: rideBob 0.45s ease-in-out infinite;
      }

      .wheel {
        transform-box: fill-box;
        transform-origin: center;
        animation: spin 0.7s linear infinite;
      }

      .pedal-crank {
        transform-box: fill-box;
        transform-origin: 0 0;
        animation: spin 0.7s linear infinite;
      }

      .leg-upper,
      .leg-lower {
        transform-box: fill-box;
      }

      .leg-left-upper {
        transform-origin: 0 0;
        animation: leftUpper 0.7s linear infinite;
      }

      .leg-left-lower {
        transform-origin: 0 0;
        animation: leftLower 0.7s linear infinite;
      }

      .leg-right-upper {
        transform-origin: 0 0;
        animation: rightUpper 0.7s linear infinite;
      }

      .leg-right-lower {
        transform-origin: 0 0;
        animation: rightLower 0.7s linear infinite;
      }

      .wing {
        transform-box: fill-box;
        transform-origin: 70% 40%;
        animation: flap 1.4s ease-in-out infinite;
      }

      .beak {
        transform-box: fill-box;
        transform-origin: left center;
        animation: beakBob 2.2s ease-in-out infinite;
      }

      .tail {
        transform-box: fill-box;
        transform-origin: right center;
        animation: tailWag 1.1s ease-in-out infinite;
      }

      .road-dash {
        animation: roadScroll 0.9s linear infinite;
      }

      .hill {
        animation: hillScroll 12s linear infinite;
      }

      .tree {
        animation: treeScroll 8s linear infinite;
      }

      .dust {
        opacity: 0.55;
        animation: dustPop 0.7s ease-out infinite;
      }

      .dust.d2 {
        animation-delay: 0.23s;
      }

      .dust.d3 {
        animation-delay: 0.46s;
      }

      @keyframes drift {
        from {
          transform: translateX(-20%);
        }
        to {
          transform: translateX(120%);
        }
      }

      @keyframes sunPulse {
        0%,
        100% {
          opacity: 0.55;
          transform: scale(1);
        }
        50% {
          opacity: 0.85;
          transform: scale(1.06);
        }
      }

      @keyframes rideBob {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-4px);
        }
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes flap {
        0%,
        100% {
          transform: rotate(0deg);
        }
        50% {
          transform: rotate(-14deg);
        }
      }

      @keyframes beakBob {
        0%,
        100% {
          transform: rotate(0deg);
        }
        50% {
          transform: rotate(3deg);
        }
      }

      @keyframes tailWag {
        0%,
        100% {
          transform: rotate(0deg);
        }
        50% {
          transform: rotate(-8deg);
        }
      }

      @keyframes roadScroll {
        from {
          stroke-dashoffset: 0;
        }
        to {
          stroke-dashoffset: -60;
        }
      }

      @keyframes hillScroll {
        from {
          transform: translateX(0);
        }
        to {
          transform: translateX(-200px);
        }
      }

      @keyframes treeScroll {
        from {
          transform: translateX(0);
        }
        to {
          transform: translateX(-320px);
        }
      }

      @keyframes dustPop {
        0% {
          opacity: 0.55;
          transform: translate(0, 0) scale(0.6);
        }
        100% {
          opacity: 0;
          transform: translate(-28px, -10px) scale(1.4);
        }
      }

      /* Simple leg pedaling approximation */
      @keyframes leftUpper {
        0% {
          transform: rotate(25deg);
        }
        50% {
          transform: rotate(-25deg);
        }
        100% {
          transform: rotate(25deg);
        }
      }

      @keyframes leftLower {
        0% {
          transform: rotate(20deg);
        }
        50% {
          transform: rotate(55deg);
        }
        100% {
          transform: rotate(20deg);
        }
      }

      @keyframes rightUpper {
        0% {
          transform: rotate(-25deg);
        }
        50% {
          transform: rotate(25deg);
        }
        100% {
          transform: rotate(-25deg);
        }
      }

      @keyframes rightLower {
        0% {
          transform: rotate(55deg);
        }
        50% {
          transform: rotate(20deg);
        }
        100% {
          transform: rotate(55deg);
        }
      }

      .hint {
        margin-top: 12px;
        text-align: center;
        font-size: 0.85rem;
        opacity: 0.65;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <h1>鹈鹕骑自行车</h1>
      <p>纯 SVG + CSS 2D 循环动画 · 打开即可播放</p>

      <div class="canvas" aria-label="鹈鹕骑自行车的动画场景">
        <svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" role="img">
          <title>一只鹈鹕骑着自行车在乡间道路上前进</title>

          <!-- Sky decorations -->
          <defs>
            <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#fff59d" />
              <stop offset="55%" stop-color="#ffd54f" />
              <stop offset="100%" stop-color="#ffb300" stop-opacity="0.15" />
            </radialGradient>
            <linearGradient id="hillGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#9ccc65" />
              <stop offset="100%" stop-color="#7cb342" />
            </linearGradient>
            <linearGradient id="bodyGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#ffffff" />
              <stop offset="100%" stop-color="#e8eef5" />
            </linearGradient>
            <linearGradient id="pouchGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#ffb74d" />
              <stop offset="100%" stop-color="#f57c00" />
            </linearGradient>
            <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
              <feDropShadow
                dx="0"
                dy="4"
                stdDeviation="4"
                flood-color="#000"
                flood-opacity="0.18"
              />
            </filter>
          </defs>

          <!-- Sun -->
          <circle class="sun-glow" cx="120" cy="90" r="56" fill="url(#sunGrad)" />
          <circle cx="120" cy="90" r="34" fill="#ffd54f" />

          <!-- Clouds -->
          <g class="cloud slow" fill="#fff" opacity="0.9">
            <ellipse cx="-80" cy="80" rx="42" ry="22" />
            <ellipse cx="-50" cy="74" rx="30" ry="18" />
            <ellipse cx="-105" cy="86" rx="28" ry="16" />
          </g>
          <g class="cloud" fill="#fff" opacity="0.85">
            <ellipse cx="-220" cy="140" rx="50" ry="24" />
            <ellipse cx="-185" cy="132" rx="34" ry="18" />
            <ellipse cx="-250" cy="146" rx="28" ry="15" />
          </g>
          <g class="cloud fast" fill="#fff" opacity="0.8">
            <ellipse cx="-360" cy="60" rx="36" ry="18" />
            <ellipse cx="-335" cy="54" rx="24" ry="14" />
            <ellipse cx="-380" cy="64" rx="20" ry="12" />
          </g>

          <!-- Distant hills (looping) -->
          <g opacity="0.9">
            <g class="hill">
              <path
                d="M-40 320 Q60 250 160 320 T360 320 T560 320 T760 320 T960 320 T1160 320 V360 H-40 Z"
                fill="url(#hillGrad)"
              />
              <path
                d="M-40 320 Q60 250 160 320 T360 320 T560 320 T760 320 T960 320 T1160 320 V360 H-40 Z"
                fill="url(#hillGrad)"
                transform="translate(200 8)"
                opacity="0.65"
              />
            </g>
          </g>

          <!-- Trees -->
          <g class="tree">
            <!-- tree set 1 -->
            <g transform="translate(40 280)">
              <rect x="14" y="40" width="10" height="36" rx="2" fill="#6d4c41" />
              <circle cx="19" cy="34" r="24" fill="#43a047" />
              <circle cx="6" cy="42" r="14" fill="#66bb6a" />
              <circle cx="32" cy="42" r="14" fill="#2e7d32" />
            </g>
            <g transform="translate(220 295)">
              <rect x="12" y="34" width="8" height="28" rx="2" fill="#6d4c41" />
              <circle cx="16" cy="28" r="18" fill="#388e3c" />
              <circle cx="5" cy="34" r="11" fill="#66bb6a" />
            </g>
            <g transform="translate(420 275)">
              <rect x="16" y="42" width="11" height="40" rx="2" fill="#5d4037" />
              <circle cx="22" cy="34" r="26" fill="#2e7d32" />
              <circle cx="6" cy="44" r="15" fill="#43a047" />
              <circle cx="36" cy="44" r="15" fill="#66bb6a" />
            </g>
            <g transform="translate(640 290)">
              <rect x="12" y="34" width="8" height="28" rx="2" fill="#6d4c41" />
              <circle cx="16" cy="28" r="18" fill="#43a047" />
            </g>
            <g transform="translate(820 280)">
              <rect x="14" y="40" width="10" height="36" rx="2" fill="#6d4c41" />
              <circle cx="19" cy="34" r="24" fill="#388e3c" />
              <circle cx="6" cy="42" r="14" fill="#66bb6a" />
            </g>
            <!-- tree set 2 for seamless loop -->
            <g transform="translate(360 0)">
              <g transform="translate(40 280)">
                <rect x="14" y="40" width="10" height="36" rx="2" fill="#6d4c41" />
                <circle cx="19" cy="34" r="24" fill="#43a047" />
                <circle cx="6" cy="42" r="14" fill="#66bb6a" />
                <circle cx="32" cy="42" r="14" fill="#2e7d32" />
              </g>
              <g transform="translate(220 295)">
                <rect x="12" y="34" width="8" height="28" rx="2" fill="#6d4c41" />
                <circle cx="16" cy="28" r="18" fill="#388e3c" />
              </g>
              <g transform="translate(420 275)">
                <rect x="16" y="42" width="11" height="40" rx="2" fill="#5d4037" />
                <circle cx="22" cy="34" r="26" fill="#2e7d32" />
              </g>
              <g transform="translate(640 290)">
                <rect x="12" y="34" width="8" height="28" rx="2" fill="#6d4c41" />
                <circle cx="16" cy="28" r="18" fill="#43a047" />
              </g>
              <g transform="translate(820 280)">
                <rect x="14" y="40" width="10" height="36" rx="2" fill="#6d4c41" />
                <circle cx="19" cy="34" r="24" fill="#388e3c" />
              </g>
            </g>
          </g>

          <!-- Ground / road -->
          <rect x="0" y="360" width="960" height="180" fill="#7cb342" />
          <path d="M0 390 Q240 370 480 390 T960 390 V520 H0 Z" fill="#8bc34a" opacity="0.55" />
          <rect x="0" y="410" width="960" height="70" fill="#616161" />
          <rect x="0" y="416" width="960" height="8" fill="#757575" />
          <line
            class="road-dash"
            x1="0"
            y1="445"
            x2="960"
            y2="445"
            stroke="#f5f5f5"
            stroke-width="5"
            stroke-dasharray="36 24"
            stroke-linecap="round"
          />
          <rect x="0" y="470" width="960" height="10" fill="#9e9e9e" opacity="0.35" />

          <!-- Rider group -->
          <g class="rider" transform="translate(300 250)" filter="url(#softShadow)">
            <!-- dust -->
            <g transform="translate(20 185)">
              <circle class="dust" cx="0" cy="0" r="6" fill="#bdbdbd" />
              <circle class="dust d2" cx="12" cy="4" r="4" fill="#cfcfcf" />
              <circle class="dust d3" cx="22" cy="2" r="5" fill="#d7d7d7" />
            </g>

            <!-- bicycle shadow -->
            <ellipse cx="150" cy="198" rx="120" ry="10" fill="#000" opacity="0.12" />

            <!-- bicycle frame -->
            <g
              stroke="#263238"
              stroke-width="6"
              stroke-linecap="round"
              stroke-linejoin="round"
              fill="none"
            >
              <!-- rear triangle -->
              <path d="M70 170 L130 110 L180 170 Z" />
              <!-- front tube -->
              <path d="M130 110 L230 95" />
              <path d="M230 95 L250 170" />
              <!-- seat post / top -->
              <path d="M130 110 L95 80" />
              <!-- chain stay -->
              <path d="M70 170 L180 170" />
              <!-- handle bar -->
              <path d="M230 95 L250 78" />
              <path d="M250 78 L275 78" />
            </g>

            <!-- seat -->
            <ellipse cx="95" cy="76" rx="22" ry="8" fill="#37474f" />
            <rect x="88" y="78" width="10" height="14" rx="3" fill="#455a64" />

            <!-- wheels -->
            <g class="wheel" transform="translate(70 170)">
              <circle r="42" fill="none" stroke="#212121" stroke-width="8" />
              <circle r="34" fill="none" stroke="#90a4ae" stroke-width="2" />
              <g stroke="#607d8b" stroke-width="2.5">
                <line x1="0" y1="-34" x2="0" y2="34" />
                <line x1="-34" y1="0" x2="34" y2="0" />
                <line x1="-24" y1="-24" x2="24" y2="24" />
                <line x1="24" y1="-24" x2="-24" y2="24" />
              </g>
              <circle r="8" fill="#37474f" />
            </g>

            <g class="wheel" transform="translate(250 170)">
              <circle r="42" fill="none" stroke="#212121" stroke-width="8" />
              <circle r="34" fill="none" stroke="#90a4ae" stroke-width="2" />
              <g stroke="#607d8b" stroke-width="2.5">
                <line x1="0" y1="-34" x2="0" y2="34" />
                <line x1="-34" y1="0" x2="34" y2="0" />
                <line x1="-24" y1="-24" x2="24" y2="24" />
                <line x1="24" y1="-24" x2="-24" y2="24" />
              </g>
              <circle r="8" fill="#37474f" />
            </g>

            <!-- crank / pedals -->
            <g class="pedal-crank" transform="translate(180 170)">
              <line
                x1="0"
                y1="0"
                x2="0"
                y2="28"
                stroke="#455a64"
                stroke-width="5"
                stroke-linecap="round"
              />
              <rect x="-10" y="26" width="20" height="7" rx="2" fill="#78909c" />
              <line
                x1="0"
                y1="0"
                x2="0"
                y2="-28"
                stroke="#455a64"
                stroke-width="5"
                stroke-linecap="round"
              />
              <rect x="-10" y="-33" width="20" height="7" rx="2" fill="#78909c" />
              <circle r="6" fill="#263238" />
            </g>

            <!-- legs (pedaling) -->
            <g
              transform="translate(150 95)"
              stroke="#f5deb3"
              stroke-width="10"
              stroke-linecap="round"
              fill="none"
            >
              <!-- left leg -->
              <g class="leg-left-upper" transform="translate(10 20)">
                <line x1="0" y1="0" x2="8" y2="34" />
                <g class="leg-left-lower" transform="translate(8 34)">
                  <line x1="0" y1="0" x2="18" y2="30" />
                  <!-- foot -->
                  <ellipse cx="22" cy="34" rx="10" ry="5" fill="#5d4037" stroke="none" />
                </g>
              </g>
              <!-- right leg -->
              <g class="leg-right-upper" transform="translate(22 20)">
                <line x1="0" y1="0" x2="-4" y2="34" stroke="#e8c99b" />
                <g class="leg-right-lower" transform="translate(-4 34)">
                  <line x1="0" y1="0" x2="16" y2="28" stroke="#e8c99b" />
                  <ellipse cx="20" cy="32" rx="10" ry="5" fill="#6d4c41" stroke="none" />
                </g>
              </g>
            </g>

            <!-- pelican body -->
            <g transform="translate(40 20)">
              <!-- tail -->
              <g class="tail">
                <path
                  d="M40 95 Q20 105 8 125 Q30 115 48 108 Z"
                  fill="#eceff1"
                  stroke="#cfd8dc"
                  stroke-width="2"
                />
                <path d="M42 100 Q28 112 18 128" fill="none" stroke="#b0bec5" stroke-width="2" />
              </g>

              <!-- body -->
              <ellipse
                cx="95"
                cy="90"
                rx="58"
                ry="42"
                fill="url(#bodyGrad)"
                stroke="#cfd8dc"
                stroke-width="2"
              />
              <ellipse cx="95" cy="100" rx="42" ry="28" fill="#f7fafc" opacity="0.9" />

              <!-- wing -->
              <g class="wing">
                <path
                  d="M70 78 Q95 40 145 55 Q155 80 125 100 Q100 108 78 95 Z"
                  fill="#eceff1"
                  stroke="#b0bec5"
                  stroke-width="2"
                />
                <path d="M88 70 Q110 55 138 62" fill="none" stroke="#90a4ae" stroke-width="2" />
                <path d="M84 82 Q112 70 136 78" fill="none" stroke="#90a4ae" stroke-width="2" />
                <path d="M82 92 Q108 84 130 90" fill="none" stroke="#90a4ae" stroke-width="2" />
              </g>

              <!-- neck -->
              <path
                d="M125 70 C150 45 165 25 178 18"
                fill="none"
                stroke="#f5f7fa"
                stroke-width="22"
                stroke-linecap="round"
              />
              <path
                d="M125 70 C150 45 165 25 178 18"
                fill="none"
                stroke="#cfd8dc"
                stroke-width="2"
                stroke-linecap="round"
              />

              <!-- head -->
              <g transform="translate(170 0)">
                <ellipse
                  cx="22"
                  cy="14"
                  rx="24"
                  ry="20"
                  fill="#fafafa"
                  stroke="#cfd8dc"
                  stroke-width="2"
                />
                <!-- eye -->
                <circle cx="28" cy="10" r="5.5" fill="#fff" stroke="#455a64" stroke-width="1.5" />
                <circle cx="29.5" cy="10" r="2.6" fill="#212121" />
                <circle cx="30.5" cy="9" r="1" fill="#fff" />
                <!-- cheek blush -->
                <ellipse cx="16" cy="18" rx="5" ry="3" fill="#ffcdd2" opacity="0.7" />

                <!-- beak + pouch -->
                <g class="beak">
                  <path
                    d="M40 12 C70 4 105 8 130 16 C100 22 70 24 42 20 Z"
                    fill="#ffb300"
                    stroke="#ef6c00"
                    stroke-width="1.5"
                  />
                  <path
                    d="M42 20 C72 34 100 40 126 28 C100 42 70 40 42 28 Z"
                    fill="url(#pouchGrad)"
                    stroke="#ef6c00"
                    stroke-width="1.5"
                  />
                  <path
                    d="M48 16 C78 12 105 14 124 20"
                    fill="none"
                    stroke="#ff8f00"
                    stroke-width="1.2"
                    opacity="0.7"
                  />
                </g>
              </g>

              <!-- tiny crest feathers -->
              <path
                d="M182 -4 Q176 -18 170 -8"
                fill="none"
                stroke="#cfd8dc"
                stroke-width="3"
                stroke-linecap="round"
              />
              <path
                d="M188 -2 Q186 -16 178 -6"
                fill="none"
                stroke="#b0bec5"
                stroke-width="3"
                stroke-linecap="round"
              />
            </g>

            <!-- wing on handle feeler / left wing tip near bar -->
            <path
              d="M230 78 Q250 70 268 76"
              fill="none"
              stroke="#cfd8dc"
              stroke-width="6"
              stroke-linecap="round"
              opacity="0.9"
            />
          </g>

          <!-- foreground grass tufts -->
          <g fill="#558b2f" opacity="0.85">
            <path d="M40 500 Q48 480 56 500 Q48 492 40 500" />
            <path d="M120 510 Q130 486 140 510 Q130 500 120 510" />
            <path d="M820 505 Q832 482 844 505 Q832 496 820 505" />
            <path d="M900 512 Q910 490 920 512 Q910 504 900 512" />
          </g>
        </svg>
      </div>

      <div class="hint">车轮旋转 · 翅膀轻扇 · 道路滚动 · 全程 CSS 动画</div>
    </div>
  </body>
</html>
