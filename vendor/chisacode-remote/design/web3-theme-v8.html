<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChisaCode · 产品升级主题方案</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        min-height: 100vh;
        padding: 34px 24px 88px;
        background: #070a0f;
        color: #e8edea;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei",
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .page-title {
        margin: 0;
        text-align: center;
        font-size: 24px;
        font-weight: 760;
        letter-spacing: 0.2px;
        background: linear-gradient(90deg, #7ccba0, #00d5ff 48%, #a78bfa);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .page-sub {
        margin: 8px auto 34px;
        max-width: 900px;
        text-align: center;
        color: #8b9a92;
        font-size: 13px;
        line-height: 1.7;
      }
      .sections {
        display: flex;
        flex-direction: column;
        gap: 58px;
        align-items: center;
      }
      .theme-section {
        width: min(1360px, 100%);
      }
      .theme-head {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 20px;
        margin: 0 0 16px;
        padding: 0 4px;
        flex-wrap: wrap;
      }
      .theme-title {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 18px;
        font-weight: 750;
        color: var(--foreground);
      }
      .theme-dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--accent), var(--neon1));
        box-shadow: 0 0 18px var(--glow);
      }
      .theme-desc {
        font-size: 12px;
        color: var(--muted);
        margin-top: 6px;
        line-height: 1.5;
      }
      .tokens {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }
      .token {
        font-size: 11px;
        color: var(--muted);
        border: 1px solid var(--border);
        background: var(--chip);
        padding: 4px 9px;
        border-radius: 999px;
        font-variant-numeric: tabular-nums;
      }
      .token b {
        color: var(--foreground);
      }
      .device-row {
        display: flex;
        align-items: flex-start;
        justify-content: center;
        gap: 28px;
        flex-wrap: wrap;
      }

      [data-theme="light"] {
        --canvas: #e7edf6;
        --frame: #f7fafd;
        --surface0: #ffffff;
        --surface1: #f5f8fc;
        --surface2: #eef3f9;
        --surface3: #e7eef7;
        --sidebar: #fbfdff;
        --foreground: #101613;
        --muted: #647489;
        --muted2: #8391a3;
        --border: #dfe7f1;
        --border2: #ccd7e6;
        --accent: #20744a;
        --accent2: #2f9e69;
        --accentText: #fff;
        --neon1: #00bfe8;
        --neon2: #8b5cf6;
        --neon3: #28d89a;
        --glow: rgba(0, 191, 232, 0.24);
        --danger: #e5484d;
        --warning: #f59e0b;
        --success: #16a34a;
        --chip: #edf3f9;
        --panel: rgba(255, 255, 255, 0.86);
        --blur: 10px;
        --shadow: 0 18px 50px rgba(27, 52, 86, 0.13);
      }
      [data-theme="dark"] {
        --canvas: #0b0f0d;
        --frame: #121513;
        --surface0: #181b1a;
        --surface1: #1f2422;
        --surface2: #252b28;
        --surface3: #2b332f;
        --sidebar: #141715;
        --foreground: #edf4ef;
        --muted: #9aa8a1;
        --muted2: #74837b;
        --border: #2a302d;
        --border2: #39423d;
        --accent: #20744a;
        --accent2: #7ccba0;
        --accentText: #07100b;
        --neon1: #00e5ff;
        --neon2: #a78bfa;
        --neon3: #7ccba0;
        --glow: rgba(0, 229, 255, 0.34);
        --danger: #ff6b73;
        --warning: #fbbf24;
        --success: #22c55e;
        --chip: #232a27;
        --panel: rgba(31, 36, 34, 0.9);
        --blur: 10px;
        --shadow: 0 20px 60px rgba(0, 0, 0, 0.48);
      }
      [data-theme="liquid"] {
        --canvas: #09101e;
        --frame: #0b1220;
        --surface0: rgba(255, 255, 255, 0.075);
        --surface1: rgba(255, 255, 255, 0.095);
        --surface2: rgba(255, 255, 255, 0.12);
        --surface3: rgba(255, 255, 255, 0.16);
        --sidebar: rgba(255, 255, 255, 0.08);
        --foreground: #f3f7ff;
        --muted: #b5c0d8;
        --muted2: #8190b1;
        --border: rgba(255, 255, 255, 0.16);
        --border2: rgba(255, 255, 255, 0.26);
        --accent: #007aff;
        --accent2: #5cc8ff;
        --accentText: #fff;
        --neon1: #00e5ff;
        --neon2: #b14cff;
        --neon3: #ff63c3;
        --glow: rgba(0, 160, 255, 0.55);
        --danger: #ff6b90;
        --warning: #ffd166;
        --success: #38f5b3;
        --chip: rgba(255, 255, 255, 0.11);
        --panel: rgba(255, 255, 255, 0.105);
        --blur: 22px;
        --shadow: 0 24px 70px rgba(0, 0, 0, 0.52);
      }
      [data-theme="chisaki"] {
        --canvas: #09070a;
        --frame: #120d12;
        --surface0: #171116;
        --surface1: #211820;
        --surface2: #2a1f28;
        --surface3: #382630;
        --sidebar: #130f14;
        --foreground: #f6edf1;
        --muted: #b49da7;
        --muted2: #7f6973;
        --border: #34242d;
        --border2: #56303c;
        --accent: #b7132f;
        --accent2: #ff4b67;
        --accentText: #fff;
        --neon1: #ff3158;
        --neon2: #7a1f3d;
        --neon3: #f4d2dc;
        --glow: rgba(255, 49, 88, 0.42);
        --danger: #ff3158;
        --warning: #e7b86b;
        --success: #d4495c;
        --chip: #2a1c25;
        --panel: rgba(31, 20, 28, 0.9);
        --blur: 12px;
        --shadow: 0 22px 70px rgba(15, 0, 6, 0.58);
      }
      [data-theme="aemeath"] {
        --canvas: #fbfdff;
        --frame: #ffffff;
        --surface0: #fffefe;
        --surface1: #fff7fb;
        --surface2: #f7fbff;
        --surface3: #edf8ff;
        --sidebar: #fff9fc;
        --foreground: #2b2028;
        --muted: #806f7c;
        --muted2: #a99ba5;
        --border: #f0e3eb;
        --border2: #dbeef8;
        --accent: #f2a7c8;
        --accent2: #9bdcf2;
        --accentText: #3a1729;
        --neon1: #f6b3d0;
        --neon2: #aee8f7;
        --neon3: #ffe7f1;
        --glow: rgba(242, 167, 200, 0.32);
        --danger: #e889b0;
        --warning: #f4cf80;
        --success: #8ed8e9;
        --chip: #fff4f9;
        --panel: rgba(255, 255, 255, 0.88);
        --blur: 14px;
        --shadow: 0 20px 56px rgba(242, 167, 200, 0.15);
      }

      .frame {
        position: relative;
        overflow: hidden;
        background: var(--frame);
        color: var(--foreground);
        border: 1px solid var(--border2);
        box-shadow: var(--shadow);
      }
      .desktop {
        width: 980px;
        height: 648px;
        border-radius: 22px;
      }
      .android {
        width: 318px;
        height: 668px;
        border-radius: 42px;
        border: 8px solid #0b0e12;
      }
      .frame::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background:
          radial-gradient(
            800px 360px at 18% -15%,
            color-mix(in srgb, var(--neon1) 18%, transparent),
            transparent 62%
          ),
          radial-gradient(
            620px 380px at 98% 20%,
            color-mix(in srgb, var(--neon2) 16%, transparent),
            transparent 64%
          );
        opacity: 0.75;
      }
      [data-theme="liquid"] .frame::before {
        opacity: 1;
        background:
          radial-gradient(450px 330px at 6% 2%, rgba(0, 122, 255, 0.54), transparent 72%),
          radial-gradient(430px 320px at 94% 16%, rgba(177, 76, 255, 0.48), transparent 70%),
          radial-gradient(520px 420px at 45% 102%, rgba(0, 229, 255, 0.36), transparent 72%);
        filter: blur(2px);
        animation: liquidDrift 12s ease-in-out infinite alternate;
      }
      [data-theme="chisaki"] .frame::before {
        opacity: 1;
        background:
          linear-gradient(
            132deg,
            transparent 0 22%,
            rgba(255, 49, 88, 0.18) 22.2% 22.7%,
            transparent 23% 43%,
            rgba(255, 49, 88, 0.22) 43.2% 43.8%,
            transparent 44% 100%
          ),
          radial-gradient(460px 300px at 8% 0%, rgba(183, 19, 47, 0.42), transparent 70%),
          radial-gradient(500px 360px at 98% 18%, rgba(122, 31, 61, 0.46), transparent 68%);
        filter: none;
      }
      [data-theme="aemeath"] .frame::before {
        opacity: 1;
        background:
          radial-gradient(2px 2px at 12% 18%, rgba(242, 167, 200, 0.52), transparent 60%),
          radial-gradient(1.5px 1.5px at 22% 36%, rgba(155, 220, 242, 0.62), transparent 60%),
          radial-gradient(2px 2px at 76% 22%, rgba(242, 167, 200, 0.44), transparent 60%),
          radial-gradient(1.5px 1.5px at 88% 68%, rgba(155, 220, 242, 0.5), transparent 60%),
          linear-gradient(
            115deg,
            transparent 0 40%,
            rgba(155, 220, 242, 0.14) 40.3% 40.8%,
            transparent 41.2% 100%
          ),
          radial-gradient(560px 330px at 12% -8%, rgba(242, 167, 200, 0.18), transparent 70%),
          radial-gradient(520px 380px at 96% 12%, rgba(155, 220, 242, 0.18), transparent 68%),
          radial-gradient(620px 420px at 48% 104%, rgba(255, 231, 241, 0.34), transparent 72%);
      }
      @keyframes liquidDrift {
        from {
          transform: translate3d(-8px, -5px, 0) scale(1);
        }
        to {
          transform: translate3d(10px, 7px, 0) scale(1.04);
        }
      }
      .inner {
        position: relative;
        z-index: 1;
        height: 100%;
        display: flex;
        flex-direction: column;
        background: linear-gradient(
          180deg,
          color-mix(in srgb, var(--surface0) 90%, transparent),
          color-mix(in srgb, var(--surface0) 96%, transparent)
        );
        backdrop-filter: blur(var(--blur));
        -webkit-backdrop-filter: blur(var(--blur));
      }
      .winbar {
        height: 31px;
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 0 13px;
        border-bottom: 1px solid var(--border);
        background: color-mix(in srgb, var(--surface1) 88%, transparent);
      }
      .traffic {
        display: flex;
        gap: 7px;
      }
      .traffic i {
        width: 11px;
        height: 11px;
        border-radius: 50%;
        display: block;
      }
      .traffic i:nth-child(1) {
        background: #ff5f57;
      }
      .traffic i:nth-child(2) {
        background: #febc2e;
      }
      .traffic i:nth-child(3) {
        background: #28c840;
      }
      .win-title {
        font-size: 11px;
        color: var(--muted);
      }

      .app {
        flex: 1;
        display: flex;
        min-height: 0;
      }
      .sidebar {
        width: 248px;
        display: flex;
        flex-direction: column;
        border-right: 1px solid var(--border);
        background: color-mix(in srgb, var(--sidebar) 94%, transparent);
        min-height: 0;
      }
      .main {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        background: color-mix(in srgb, var(--surface0) 92%, transparent);
      }
      .sb-top {
        height: 46px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 12px;
        border-bottom: 1px solid var(--border);
      }
      .ghostbtn {
        height: 30px;
        border-radius: 10px;
        border: 1px solid transparent;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        color: var(--muted);
        font-size: 12px;
      }
      .ghostbtn.square {
        width: 30px;
      }
      .ghostbtn.wide {
        padding: 0 10px;
        flex: 1;
        justify-content: flex-start;
      }
      .ghostbtn:hover {
        background: var(--surface2);
        color: var(--foreground);
      }
      .sb-actions {
        padding: 11px 12px;
        display: grid;
        gap: 8px;
        border-bottom: 1px solid var(--border);
      }
      .primary-action {
        height: 40px;
        border-radius: 13px;
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 0 12px;
        background: linear-gradient(135deg, var(--accent), var(--neon1));
        color: #fff;
        font-size: 13px;
        font-weight: 760;
        box-shadow: 0 10px 24px color-mix(in srgb, var(--glow) 72%, transparent);
      }
      .search-action {
        height: 36px;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: var(--surface1);
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 0 12px;
        color: var(--foreground);
        font-size: 13px;
        font-weight: 650;
      }
      .sessions {
        flex: 1;
        padding: 9px 8px;
        overflow: hidden;
      }
      .dir-group {
        margin: 8px 0 12px;
      }
      .dir-head {
        height: 30px;
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 0 8px;
        border-radius: 10px;
        color: var(--foreground);
        font-size: 12px;
        font-weight: 820;
        background: color-mix(in srgb, var(--surface2) 66%, transparent);
        border: 1px solid var(--border);
      }
      .dir-path {
        margin-left: auto;
        color: var(--muted);
        font-size: 10px;
        font-family: "SFMono-Regular", Consolas, monospace;
      }
      .session {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 7px 8px 7px 18px;
        border-radius: 12px;
        min-height: 45px;
        position: relative;
      }
      .session:before {
        content: "";
        position: absolute;
        left: 8px;
        top: 0;
        bottom: 0;
        width: 1px;
        background: var(--border);
      }
      .session.active {
        background: color-mix(in srgb, var(--accent) 10%, var(--surface2));
        outline: 1px solid color-mix(in srgb, var(--accent) 18%, var(--border));
        box-shadow: none;
      }
      .session:hover {
        background: var(--surface2);
      }
      .provider {
        width: 28px;
        height: 28px;
        border-radius: 9px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 12px;
        font-weight: 850;
        flex: 0 0 auto;
      }
      .s-main {
        min-width: 0;
        flex: 1;
      }
      .s-title {
        font-size: 12.5px;
        font-weight: 720;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .s-meta {
        font-size: 10.5px;
        color: var(--muted);
        margin-top: 2px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .s-side {
        display: flex;
        align-items: center;
        gap: 7px;
        flex: 0 0 auto;
      }
      .status {
        width: 8px;
        height: 8px;
        border-radius: 50%;
      }
      .status.run {
        background: var(--warning);
        box-shadow: 0 0 10px var(--warning);
        animation: pulse 1.4s infinite;
      }
      .status.done {
        background: var(--success);
      }
      .status.idle {
        background: var(--muted2);
      }
      @keyframes pulse {
        50% {
          opacity: 0.35;
        }
      }
      .time {
        font-size: 11px;
        color: var(--muted);
      }
      .badge {
        font-size: 10px;
        font-weight: 760;
        border-radius: 7px;
        padding: 2px 6px;
        border: 1px solid var(--border);
      }
      .badge.warn {
        color: var(--danger);
        background: color-mix(in srgb, var(--danger) 13%, transparent);
        border-color: color-mix(in srgb, var(--danger) 35%, transparent);
      }
      .badge.arch {
        color: var(--muted);
        background: var(--surface2);
      }
      .sb-footer {
        height: 52px;
        border-top: 1px solid var(--border);
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
      }
      .host {
        height: 34px;
        flex: 1;
        display: flex;
        align-items: center;
        gap: 8px;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: var(--surface1);
        padding: 0 10px;
        font-size: 12px;
        font-weight: 720;
      }
      .host-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--success);
        box-shadow: 0 0 9px var(--success);
      }

      .workspace-head {
        height: 52px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 14px;
        background: color-mix(in srgb, var(--surface0) 88%, transparent);
      }
      .branch {
        height: 32px;
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 0 12px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: var(--chip);
        font-size: 12px;
        font-weight: 760;
      }
      .branch .icon {
        color: var(--accent);
      }
      .workspace-title {
        min-width: 0;
      }
      .workspace-title b {
        display: block;
        font-size: 13px;
      }
      .workspace-title span {
        display: block;
        font-size: 11px;
        color: var(--muted);
        margin-top: 1px;
      }
      .head-spacer {
        flex: 1;
      }
      .tool {
        width: 32px;
        height: 32px;
        border-radius: 11px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--muted);
        border: 1px solid transparent;
      }
      .tool.on {
        color: var(--accent2);
        background: var(--surface1);
        border-color: var(--border);
      }
      .tabs {
        height: 38px;
        display: flex;
        align-items: center;
        gap: 5px;
        padding: 0 12px;
        border-bottom: 1px solid var(--border);
        background: var(--surface1);
      }
      .tab {
        height: 28px;
        border-radius: 10px;
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 0 11px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 680;
      }
      .tab.active {
        color: var(--foreground);
        background: var(--surface0);
        box-shadow: inset 0 -2px 0 var(--accent);
      }
      .content {
        flex: 1;
        display: flex;
        min-height: 0;
        position: relative;
      }
      .work {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      .work-scroll {
        flex: 1;
        padding: 18px 20px 16px;
        overflow: hidden;
      }
      .agent-card {
        background: var(--panel);
        backdrop-filter: blur(var(--blur));
        border-radius: 15px;
        padding: 10px;
        margin-bottom: 10px;
      }
      .run-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .run-title {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 11.5px;
        font-weight: 700;
      }
      .run-title .pulse-ring {
        width: 24px;
        height: 24px;
        border-radius: 9px;
        background: linear-gradient(135deg, var(--accent), var(--neon1));
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        box-shadow: 0 0 16px var(--glow);
        flex-shrink: 0;
      }
      .run-state {
        font-size: 10px;
        color: var(--warning);
        font-weight: 700;
      }
      .progress {
        height: 4px;
        border-radius: 99px;
        background: var(--surface2);
        overflow: hidden;
        margin: 8px 0 7px;
      }
      .progress i {
        display: block;
        width: 62%;
        height: 100%;
        border-radius: 99px;
        background: linear-gradient(90deg, var(--accent), var(--neon1), var(--neon2));
        box-shadow: 0 0 8px var(--glow);
      }
      .run-copy {
        font-size: 11px;
        line-height: 1.55;
        color: var(--foreground);
      }
      .chips {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-top: 8px;
      }
      .chip {
        height: 23px;
        display: flex;
        align-items: center;
        gap: 5px;
        border-radius: 999px;
        border: 1px solid transparent;
        background: var(--chip);
        padding: 0 8px;
        color: var(--muted);
        font-size: 10.5px;
        font-weight: 500;
      }
      .message-row {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        margin: 14px 0;
      }
      .avatar {
        width: 30px;
        height: 30px;
        border-radius: 10px;
        background: #10a37f;
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;

      /* 2. interaction — smooth transitions + pressed feedback + focus ring */
      .ghostbtn,
      .tool,
      .toolchip,
      .chip,
      .tab,
      .session,
      .dir-head,
      .branch,
      .remote-pill,
      .settings-nav-item,
      .host,

      .run-btn,
      .fab,
      .env-row {
        transition:
          background 0.18s ease,
          color 0.18s ease,
          transform 0.12s ease,
          box-shadow 0.18s ease;
      }
      .ghostbtn:active,
      .tool:active,
      .toolchip:active,
      .chip:active,
      .tab:active,
      .dir-head:active,
      .branch:active,
      .remote-pill:active,
      .settings-nav-item:active,
      .host:active {
        transform: scale(0.96);
      }
      .primary-action:active,
      .run-btn:active,
      .fab:active {
        transform: scale(0.94);

      .ghostbtn:focus-visible,
      .tool:focus-visible,
      .toolchip:focus-visible,
      .tab:focus-visible,
      .primary-action:focus-visible,
      .run-btn:focus-visible,
