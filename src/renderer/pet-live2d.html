<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>桌面宠物</title>
    <link rel="stylesheet" href="dsh-webui-tokens.css">
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        user-select: none;
        -webkit-user-select: none;
      }
      #pet {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      /* Quick-chat dialog — a real mini conversation card that follows her
         head (the renderer re-anchors it every frame). Flat fill + hairline,
         dsw tokens only: a drop shadow compounds into a black halo on this
         layered window. */
      #pet-chat {
        position: fixed;
        z-index: 11;
        width: 248px;
        background: var(--dsw-alias-bg-layer-1);
        border: 1px solid var(--dsw-alias-border-l2);
        border-radius: 12px;
        font-family: var(--dsw-font-family);
        color: var(--dsw-alias-label-primary);
        font-size: 12px;
        box-sizing: border-box;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      #pet-chat[hidden] { display: none; }
      #pet-chat .pc-head {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 8px 10px 6px;
        border-bottom: 1px solid var(--dsw-alias-border-l2);
      }
      #pet-chat .pc-avatar { font-size: 14px; line-height: 1; }
      #pet-chat .pc-name { font-weight: 600; font-size: 12px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      #pet-chat .pc-x, #pet-chat .pc-tool {
        border: 0;
        background: transparent;
        color: var(--dsw-alias-label-primary);
        cursor: pointer;
        font-size: 11px;
        opacity: 0.6;
        padding: 2px 4px;
        line-height: 1;
      }
      #pet-chat .pc-x:hover, #pet-chat .pc-tool:hover { opacity: 1; }
      /* Composer-style model seat; the menu is portaled outside this card. */
      #pet-chat .pc-models {
        display: flex;
        min-width: 0;
        padding: 5px 8px 3px;
        border-top: 1px solid var(--dsw-alias-border-l2);
      }
      #pet-chat .pc-models[hidden] { display: none; }
      #pet-chat .pc-choice {
        display: flex;
        align-items: center;
        gap: 4px;
        min-width: 0;
        max-width: 100%;
        height: 28px;
        padding: 0 7px;
        border: 0;
        border-radius: 24px;
        background: transparent;
        color: var(--dsw-alias-label-secondary);
        font-family: inherit;
        font-size: 11px;
        font-weight: 500;
        cursor: pointer;
      }
      #pet-chat .pc-choice:hover,
      #pet-chat .pc-choice[aria-expanded='true'] {
        background: var(--dsw-alias-interactive-bg-hover);
      }
      #pet-chat .pc-choice:focus-visible, #pc-picker button:focus-visible {
        outline: 2px solid var(--dsw-alias-border-l3);
        outline-offset: -2px;
      }
      #pet-chat .pc-choice-value, #pet-chat .pc-choice-effort {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #pet-chat .pc-choice-effort { color: var(--dsw-alias-label-caption); flex-shrink: 1000; }
      #pet-chat .pc-choice-chevron {
        flex: none;
        width: 5px;
        height: 5px;
        border-right: 1.5px solid var(--dsw-alias-label-secondary);
        border-bottom: 1.5px solid var(--dsw-alias-label-secondary);
        transform: translateY(-2px) rotate(45deg);
      }
      #pc-picker {
        position: fixed;
        z-index: 20;
        box-sizing: border-box;
        width: min(240px, calc(100vw - 8px));
        max-height: min(280px, calc(100vh - 8px));
        overflow-y: auto;
        padding: 3px;
        border: 1px solid var(--dsw-alias-border-l1);
        border-radius: 16px;
        background: var(--dsw-specific-menu, var(--dsw-alias-bg-layer-1));
        backdrop-filter: var(--dsw-menu-backdrop-filter, blur(16px));
        box-shadow: var(--dsw-elevation-prominent, 0 8px 24px rgba(0,0,0,.16));
        color: var(--dsw-alias-label-primary);
        scrollbar-width: thin;
      }
      #pc-picker[hidden] { display: none; }
      #pc-picker::-webkit-scrollbar { width: 6px; }
      #pc-picker::-webkit-scrollbar-thumb { border-radius: 6px; background: var(--dsw-alias-scrollbar-bg-l2); }
      #pc-picker::-webkit-scrollbar-thumb:hover { background: var(--dsw-alias-scrollbar-hover-l2); }
      #pc-picker .pc-picker-group {
        padding: 6px 8px 3px;
        color: var(--dsw-alias-label-tertiary);
        font-size: 11px;
        line-height: 16px;
      }
      #pc-picker .pc-option {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
        width: 100%;
        min-height: 34px;
        padding: 5px 8px;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: var(--dsw-alias-label-primary);
        font-family: inherit;
        font-size: 12px;
        line-height: 18px;
        text-align: left;
        cursor: pointer;
      }
      #pc-picker .pc-option:hover, #pc-picker .pc-option:focus-visible { background: var(--dsw-alias-interactive-bg-hover); }
      #pc-picker .pc-option[data-pane='root'] { justify-content: flex-start; }
      #pc-picker .pc-option-name {
        display: block;
        min-width: 0;
        text-overflow: ellipsis;
        overflow: hidden;
        white-space: nowrap;
      }
      #pc-picker .pc-option-detail { margin-left: auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--dsw-alias-label-tertiary); }
      #pc-picker .pc-option-check {
        flex: none;
        color: var(--dsw-alias-label-primary);
        font-size: 12px;
      }
      #pet-chat .pc-thread {
        display: flex;
        flex-direction: column;
        gap: 5px;
        padding: 8px 10px;
        max-height: 148px;
        overflow-y: auto;
        scrollbar-width: none;
        flex: none;
      }
      #pet-chat .pc-thread::-webkit-scrollbar { display: none; }
      #pet-chat .pc-empty {
        color: var(--dsw-alias-label-primary);
        opacity: 0.45;
        font-size: 11px;
        text-align: center;
        padding: 8px 0 10px;
      }
      #pet-chat .pc-msg {
        max-width: 86%;
        padding: 5px 9px;
        border-radius: 10px;
        font-size: 12px;
        line-height: 1.5;
        white-space: pre-wrap;
        word-break: break-word;
        user-select: text;
        -webkit-user-select: text;
      }
      #pet-chat .pc-msg.pc-user {
        align-self: flex-end;
        background: color-mix(in srgb, var(--dsw-alias-state-business-primary) 16%, transparent);
        border-bottom-right-radius: 4px;
      }
      #pet-chat .pc-msg.pc-her {
        align-self: flex-start;
        background: var(--dsw-alias-bg-layer-2, rgba(128,128,128,.12));
        border-bottom-left-radius: 4px;
      }
      #pet-chat .pc-msg.pc-err {
        align-self: center;
        background: transparent;
        color: var(--dsw-alias-state-error-primary, #e5534b);
        font-size: 11px;
        padding: 2px 4px;
      }
      #pet-chat .pc-msg.pc-typing {
        align-self: flex-start;
        background: var(--dsw-alias-bg-layer-2, rgba(128,128,128,.12));
        border-bottom-left-radius: 4px;
        color: var(--dsw-alias-label-primary);
        opacity: 0.7;
        letter-spacing: 2px;
      }
      #pet-chat .pc-compose {
        display: flex;
        align-items: flex-end;
        gap: 6px;
        padding: 6px 10px 10px;
      }
      #pet-chat textarea {
        flex: 1;
        resize: none;
        border: 1px solid var(--dsw-alias-border-l2);
        border-radius: 9px;
        background: transparent;
        color: var(--dsw-alias-label-primary);
        font-family: inherit;
        font-size: 12px;
        line-height: 1.5;
        padding: 5px 8px;
        outline: none;
        max-height: 66px;
        box-sizing: border-box;
        user-select: text;
        -webkit-user-select: text;
        overflow-y: auto;
        scrollbar-width: none;
      }
      #pet-chat textarea::-webkit-scrollbar { display: none; }
      #pet-chat textarea:focus { border-color: var(--dsw-alias-state-business-primary); }
      #pet-chat .pc-send {
        flex: none;
        width: 26px;
        height: 26px;
        border: 0;
        border-radius: 50%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 13px;
        line-height: 1;
        cursor: pointer;
        background: var(--dsw-alias-state-business-primary);
        color: var(--dsw-alias-bg-layer-1, #fff);
      }
      #pet-chat .pc-send:disabled {
        background: var(--dsw-alias-border-l2);
        opacity: 0.55;
        cursor: default;
      }
    </style>
  </head>
  <body>
    <canvas id="pet"></canvas>
    <div id="pet-chat" hidden>
      <div class="pc-head">
        <span class="pc-avatar" aria-hidden="true">🐳</span>
        <span class="pc-name">鲸鱼娘</span>
        <button id="pc-open" class="pc-tool" type="button" hidden title="在助理中打开" aria-label="在助理中打开">↗</button>
        <button id="pc-close" class="pc-x" type="button" aria-label="关闭">✕</button>
      </div>
      <div id="pc-thread" class="pc-thread"><div class="pc-empty" id="pc-empty">和她说点什么…</div></div>
      <div id="pc-models" class="pc-models" hidden>
        <button id="pc-model-trigger" class="pc-choice" type="button" aria-haspopup="menu" aria-controls="pc-picker" aria-expanded="false"><span class="pc-choice-value">选择模型</span><span class="pc-choice-effort" hidden></span><span class="pc-choice-chevron" aria-hidden="true"></span></button>
        <span id="pc-effort-box" hidden></span>
        <select id="pc-model" hidden tabindex="-1" aria-hidden="true"></select>
        <select id="pc-effort" hidden tabindex="-1" aria-hidden="true"></select>
      </div>
      <div class="pc-compose">
        <textarea id="pc-input" rows="1" maxlength="200" placeholder="说点什么…" autocomplete="off"></textarea>
        <button id="pc-send" class="pc-send" type="button" disabled aria-label="发送">↑</button>
      </div>
    </div>
    <div id="pc-picker" role="menu" aria-label="模型与思考" hidden></div>
    <script src="pet-live2d/ort/ort.all.min.js"></script>
    <script src="pet-live2d/anime4k.js"></script>
    <script src="pet-physics.js"></script>
    <script src="pet-dialogue.js"></script>
    <script src="pet-wander.js"></script>
    <script src="pet-live2d.js"></script>
  </body>
</html>
