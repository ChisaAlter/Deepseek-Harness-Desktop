<!DOCTYPE html>
<html lang="zh-CN" data-boot-theme>
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:;" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Whale Isle</title>
  <link rel="stylesheet" href="../shared/dsh-webui-tokens.css" />
  <link rel="stylesheet" href="boot-tokens.css" />
  <link rel="stylesheet" href="boot.css" />
  <link rel="stylesheet" href="window-controls.css" />
</head>
<body data-state="starting">
  <div class="caption" aria-hidden="true"></div>
  <div class="window-controls"></div>
  <main class="scene">
    <div class="stars" aria-hidden="true"></div>
    <div class="horizon" aria-hidden="true"></div>
    <div class="underwater" aria-hidden="true">
      <span class="snow"></span><span class="snow"></span><span class="snow"></span><span class="snow"></span><span class="snow"></span>
    </div>
    <div class="abyss" aria-hidden="true"></div>
    <div class="core">
      <p class="brand">Whale Isle<small>鲸屿 · DESKTOP</small></p>
      <p class="status" id="status" role="status"><span id="status-text">启动中</span><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span></p>
      <p class="hint" id="hint" hidden></p>
      <p class="failure" id="failure" hidden></p>
      <p class="recovery" id="recovery" aria-live="polite" hidden></p>
      <div class="actions" id="actions" hidden>
        <button type="button" class="primary" id="retry">重试</button>
        <button type="button" class="ghost" id="cancel-restart" hidden>取消自动重启</button>
        <button type="button" class="ghost" id="open-launcher" hidden>回启动器排查</button>
        <button type="button" class="ghost" id="save-log">下载日志</button>
      </div>
    </div>
    <div class="ticker" aria-live="polite">
      <div class="ticker-inner" id="ticker-inner" role="button" tabindex="0" title="查看全部日志">
        <span class="ticker-dot" aria-hidden="true"></span>
        <span class="ticker-line" id="ticker-line"></span>
        <span class="ticker-count" id="ticker-count">L 00</span>
        <span class="ticker-open">全部日志</span>
      </div>
    </div>
    <div class="logdrawer" id="logdrawer" hidden>
      <div class="logdrawer-panel" role="dialog" aria-label="启动日志">
        <div class="logdrawer-head">
          <span class="logdrawer-title">启动日志</span>
          <span class="logdrawer-count" id="log-count"></span>
          <button type="button" class="logdrawer-close" id="log-close" aria-label="关闭">×</button>
        </div>
        <ol class="logdrawer-lines" id="log" aria-label="全部启动日志"></ol>
      </div>
    </div>
  </main>
  <script src="theme.js"></script>
  <script src="window-controls.js"></script>
  <script src="boot-recovery.js"></script>
  <script src="boot.js"></script>
</body>
</html>
