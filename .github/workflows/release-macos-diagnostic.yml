name: Release macOS single-file diagnosis
on:
  push:
    branches: [codex/release-macos-diagnostic-463b3455]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [normal, jitless]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 463b3455d05806cd725f835c9648fed63a54b5a2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
      - name: Observe single-file result with TAP details
        shell: bash
        env:
          MODE: ${{ matrix.mode }}
        run: |
          flags=()
          if [[ "$MODE" == "jitless" ]]; then flags+=(--jitless); fi
          node "${flags[@]}" --test --test-reporter=tap src/renderer/pet-live2d.test.js