name: Development CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      include_macos:
        description: Also build the macOS installer
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: development-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      product: ${{ steps.changes.outputs.product }}
      vendor: ${{ steps.changes.outputs.vendor }}
      tools: ${{ steps.changes.outputs.tools }}
      motion: ${{ steps.changes.outputs.motion }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
      - id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/ci-scope.mjs
  tools:
    needs: scope
    if: needs.scope.outputs.tools == 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node node_modules/electron/install.js
      - run: npm run test:tools
  windows:
    needs: scope
    if: needs.scope.outputs.product == 'true'
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      LEFTHOOK: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Check remote dependency lock
        run: npm ci --ignore-scripts --dry-run --no-audit --no-fund
        working-directory: vendor/chisacode-remote
      - run: node node_modules/electron/install.js
      - name: Build the shipped Harness profile
        run: npm run setup:harness
      - name: Desktop behavior tests
        run: npm test
      - name: GUI behavior tests
        if: needs.scope.outputs.vendor == 'true'
        run: node node_modules/pnpm/bin/pnpm.cjs --dir vendor/deepseek-harness run test:gui
      - name: Core behavior tests
        if: needs.scope.outputs.vendor == 'true'
        run: node node_modules/pnpm/bin/pnpm.cjs --dir vendor/deepseek-harness exec vitest run packages/core/agent-loop packages/core/session packages/core/tools packages/llm packages/api/session-controller packages/api/workspace-controller packages/fs/tool-fs packages/workspace packages/session/session-projection-cache packages/subagent/subagent --maxWorkers 2
      - name: Malformed tool recovery
        if: needs.scope.outputs.vendor == 'true'
        run: node node_modules/pnpm/bin/pnpm.cjs --dir vendor/deepseek-harness exec vitest run --config vitest.snapshot.config.ts snapshots/session/headless.snapshot.ts -t "replays malformed-tool-call-retry"
      - name: Built desktop composition
        if: needs.scope.outputs.vendor == 'true'
        run: node scripts/check-skip-compose-contract.js vendor/deepseek-harness
      - name: Built desktop styling
        if: needs.scope.outputs.vendor == 'true'
        run: node scripts/check-built-shell.mjs
      - name: Native window behavior
        if: needs.scope.outputs.motion == 'true'
        run: node scripts/run-window-motion-qa.mjs
      - name: Build Windows installer
        run: npm run dist
      - name: Start the packaged application
        env:
          DSH_SMOKE_TIMEOUT_MS: '600000'
        run: npm run smoke:packaged
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Whale-Isle-windows-x64
          path: |
            dist/Whale-Isle-Setup-*.exe
            dist/Whale-Isle-Setup-*.exe.blockmap
            dist/latest.yml
          if-no-files-found: error
          retention-days: 30
  macos:
    if: github.event_name == 'workflow_dispatch' && inputs.include_macos
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      LEFTHOOK: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: node scripts/check-mac-icon.js
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm run setup:harness
      - run: npm test
      - run: npm run dist:mac
      - run: npm run smoke:packaged
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Whale-Isle-macos-arm64
          path: dist/Whale-Isle-*.dmg
          if-no-files-found: error
          retention-days: 30
  result:
    name: CI
    if: always()
    needs: [scope, tools, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module -e '
            for (const [name, job] of Object.entries(JSON.parse(process.env.RESULTS))) {
              console.log(name + ": " + job.result);
              if (!["success", "skipped"].includes(job.result)) process.exitCode = 1;
            }
          '
