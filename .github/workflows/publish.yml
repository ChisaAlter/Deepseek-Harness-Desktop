name: Promote release candidate

on:
  workflow_dispatch:
    inputs:
      ci_nonpass_count:
        description: Verified cumulative non-passing attempts for this same delivery; four means stop
        required: true
        type: number
      ci_count_evidence:
        description: Cross-commit/workflow/session run history establishing that count
        required: true
        type: string
      ci_recovery_decision:
        description: 'Only after a stop; <unchanged count>: user decision reference and corrected local QA evidence'
        required: false
        type: string
      candidate_run_id:
        description: Successful release.yml workflow_dispatch run that produced the candidate artifacts
        required: true
        type: string
      release_tag:
        description: New Git tag to publish, for example v0.3.0
        required: true
        type: string
      expected_setup_sha256:
        description: SHA256 of the Windows Setup executable from the candidate run
        required: true
        type: string
      acceptance_commit:
        description: Full main commit SHA containing docs/qa/releases/<tag>/<candidate_run_id>.json
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-release
  queue: max
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Enforce cumulative CI stop rule
        env:
          CI_NONPASS_COUNT: ${{ inputs.ci_nonpass_count }}
          CI_COUNT_EVIDENCE: ${{ inputs.ci_count_evidence }}
          CI_RECOVERY_DECISION: ${{ inputs.ci_recovery_decision }}
        run: |
          set -euo pipefail
          [[ "$CI_NONPASS_COUNT" =~ ^(0|[1-9][0-9]*)$ && "$CI_COUNT_EVIDENCE" =~ [^[:space:]] ]] || { echo 'Verified cumulative CI history is required'; exit 1; }
          if (( CI_NONPASS_COUNT >= 4 )); then
            [[ "$CI_RECOVERY_DECISION" == "$CI_NONPASS_COUNT:"* && "${CI_RECOVERY_DECISION#*:}" =~ [^[:space:]] ]] || { echo 'Four non-passing attempts: stop; require a user corrective decision for the unchanged count'; exit 1; }
          fi
          printf '%s\n' "$CI_COUNT_EVIDENCE" "$CI_RECOVERY_DECISION" >> "$GITHUB_STEP_SUMMARY"
      - name: Inspect candidate workflow run
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          EXPECTED_SETUP_SHA256: ${{ inputs.expected_setup_sha256 }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_RUN_ID" =~ ^[0-9]+$ ]] || { echo "candidate_run_id must be numeric" >&2; exit 1; }
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "release_tag must be a stable vMAJOR.MINOR.PATCH tag" >&2; exit 1; }
          [[ "$EXPECTED_SETUP_SHA256" =~ ^[0-9a-fA-F]{64}$ ]] || { echo "expected_setup_sha256 must be a 64-character SHA256" >&2; exit 1; }

          run_json=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID")
          status=$(jq -r '.status' <<<"$run_json")
          conclusion=$(jq -r '.conclusion' <<<"$run_json")
          event=$(jq -r '.event' <<<"$run_json")
          workflow_path=$(jq -r '.path' <<<"$run_json")
          workflow_sha=$(jq -r '.head_sha' <<<"$run_json")
          head_branch=$(jq -r '.head_branch' <<<"$run_json")
          [[ "$status" == completed && "$conclusion" == success ]] || { echo "Candidate run must be completed and successful" >&2; exit 1; }
          [[ "$event" == workflow_dispatch ]] || { echo "Candidate run must be a manual workflow_dispatch" >&2; exit 1; }
          [[ "$workflow_path" == .github/workflows/release.yml ]] || { echo "Candidate run must come from release.yml" >&2; exit 1; }
          [[ "$head_branch" == main ]] || { echo "Candidate run must come from the main branch" >&2; exit 1; }
          # Workflow head may include newer documentation. The frozen plan
          # records the explicit commit checked out by every packaging job.
          mkdir -p "$RUNNER_TEMP/release-evidence"
          gh run download "$CANDIDATE_RUN_ID" --name Whale-Isle-release-plan --dir "$RUNNER_TEMP/release-evidence" --repo "$GITHUB_REPOSITORY"
          candidate_sha=$(jq -r '.candidateSha' "$RUNNER_TEMP/release-evidence/release-plan.json")
          plan_run=$(jq -r '.runId' "$RUNNER_TEMP/release-evidence/release-plan.json")
          [[ "$candidate_sha" =~ ^[0-9a-f]{40}$ && "$plan_run" == "$CANDIDATE_RUN_ID" ]] || { echo 'Candidate plan identity mismatch'; exit 1; }
          echo "candidate_sha=$candidate_sha" >> "$GITHUB_OUTPUT"
          echo "workflow_sha=$workflow_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout the exact candidate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.candidate.outputs.candidate_sha }}
          fetch-depth: 1
          sparse-checkout: |
            .github/release-notes.md
            .github/release-notes.en.md
            .nvmrc
            package-lock.json
            package.json
            scripts/check-release-version.mjs
            scripts/check-release-assets.mjs
            scripts/check-release-ci.mjs
            scripts/check-release-acceptance.mjs
            scripts/release-plan.mjs
            docs/qa/production-acceptance-test-cases.md
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # .nvmrc is the single Node version source shared with test/release.
          node-version-file: .nvmrc
          cache: npm

      - name: Prepare the validator runtime (lockfile-respecting, scripts disabled)
        # The validator parses latest.yml with the js-yaml already resolved via
        # electron-updater. Install exactly what the candidate SHA's lockfile
        # declares — nothing is fetched ad hoc and no ambient runner packages
        # are assumed. `--ignore-scripts` keeps the install to declared
        # packages and forbids lifecycle hooks.
        run: npm ci --ignore-scripts

      - name: Verify tag matches candidate package version
        run: node scripts/check-release-version.mjs "${{ inputs.release_tag }}"

      - name: Inspect platforms and require eligible CI for the exact candidate SHA
        id: platforms
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.candidate_sha }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          set -euo pipefail
          mac_count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID/artifacts?per_page=100" --jq '[.artifacts[] | select(.name == "Whale-Isle-macos-arm64" and .expired == false)] | length')
          include_macos=false
          if [ "$mac_count" -gt 0 ]; then include_macos=true; fi
          echo "include_macos=$include_macos" >> "$GITHUB_OUTPUT"
          node scripts/check-release-ci.mjs "$GITHUB_REPOSITORY" "$CANDIDATE_SHA" "$include_macos"

      - name: Download the frozen plan and immutable acceptance record
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          ACCEPTANCE_COMMIT: ${{ inputs.acceptance_commit }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          [[ "$ACCEPTANCE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo 'acceptance_commit must be a full SHA'; exit 1; }
          relation=$(gh api "repos/$GITHUB_REPOSITORY/compare/$ACCEPTANCE_COMMIT...main" --jq .status)
          [[ "$relation" == ahead || "$relation" == identical ]] || { echo 'Acceptance must be committed on main'; exit 1; }
          mkdir -p evidence-out
          cp "$RUNNER_TEMP/release-evidence/release-plan.json" evidence-out/release-plan.json
          gh api -H 'Accept: application/vnd.github.raw+json' "repos/$GITHUB_REPOSITORY/contents/docs/qa/releases/$RELEASE_TAG/$CANDIDATE_RUN_ID.json?ref=$ACCEPTANCE_COMMIT" > evidence-out/release-acceptance.json

      - name: Download Windows artifacts from the supplied candidate run
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          set -euo pipefail
          mkdir -p dist-out
          gh run download "$CANDIDATE_RUN_ID" --name Whale-Isle-windows-x64 --dir dist-out --repo "$GITHUB_REPOSITORY"

      - name: Verify candidate assets, metadata and Setup SHA256
        env:
          EXPECTED_SETUP_SHA256: ${{ inputs.expected_setup_sha256 }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          # The validator is read-only, offline and uses only the candidate
          # SHA's own checked-out helper — never code from another revision.
          if [[ ! -f scripts/check-release-assets.mjs ]]; then
            echo "scripts/check-release-assets.mjs is missing from candidate SHA; refusing to substitute another revision" >&2
            exit 1
          fi
          # Provenance records the digest the validator actually confirmed, not
          # the operator string echoed back.
          validator_output=$(node scripts/check-release-assets.mjs \
            dist-out "$RELEASE_TAG" "${RELEASE_TAG#v}" "$EXPECTED_SETUP_SHA256")
          printf '%s\n' "$validator_output"
          actual_setup_sha256=$(printf '%s\n' "$validator_output" | sed -n 's/.*sha256=\([0-9a-f]\{64\}\).*/\1/p')
          [[ "$actual_setup_sha256" =~ ^[0-9a-f]{64}$ ]] || {
            echo "Validator did not report a verified Setup SHA256" >&2
            exit 1
          }
          echo "setup_sha256=$actual_setup_sha256" >> "$GITHUB_ENV"

      - name: Download optional macOS artifact from the same candidate run
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          set -euo pipefail
          mac_count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID/artifacts?per_page=100" --jq '[.artifacts[] | select(.name == "Whale-Isle-macos-arm64" and .expired == false)] | length')
          if [ "$mac_count" -gt 0 ]; then
            mkdir -p macos-out
            gh run download "$CANDIDATE_RUN_ID" --name Whale-Isle-macos-arm64 --dir macos-out --repo "$GITHUB_REPOSITORY"
          fi

      - name: Validate installed acceptance against the original assets
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.candidate_sha }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          INCLUDE_MACOS: ${{ steps.platforms.outputs.include_macos }}
        run: |
          set -euo pipefail
          node --input-type=module -e 'import fs from "node:fs"; const plan=JSON.parse(fs.readFileSync("evidence-out/release-plan.json")); if (plan.platforms.includes("macos-arm64") !== (process.env.INCLUDE_MACOS === "true")) process.exit(1);'
          node scripts/check-release-acceptance.mjs verify evidence-out/release-plan.json evidence-out/release-acceptance.json dist-out macos-out

      - name: Build checksums and provenance notes
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.candidate_sha }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          ACCEPTANCE_COMMIT: ${{ inputs.acceptance_commit }}
          WORKFLOW_SHA: ${{ steps.candidate.outputs.workflow_sha }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          windows_files=(dist-out/Whale-Isle-Setup-*.exe dist-out/Whale-Isle-Setup-*.exe.blockmap dist-out/latest.yml)
          (( ${#windows_files[@]} >= 3 )) || { echo "No complete Windows candidate asset set to checksum" >&2; exit 1; }
          (
            cd dist-out
            sha512sum Whale-Isle-Setup-*.exe Whale-Isle-Setup-*.exe.blockmap latest.yml > SHA512SUMS.txt
          )
          macos_files=(macos-out/*.dmg)
          if (( ${#macos_files[@]} > 0 )); then
            (
              cd macos-out
              sha512sum *.dmg >> ../dist-out/SHA512SUMS.txt
            )
          fi
          cat .github/release-notes.md > release-body.md
          printf '\n\n---\n\n' >> release-body.md
          cat .github/release-notes.en.md >> release-body.md
          cat acceptance-notes.md >> release-body.md
          {
            printf '\n\n## Release provenance\n\n'
            printf -- '- Release tag: `%s`\n' "$RELEASE_TAG"
            printf -- '- Candidate workflow: `release.yml` run `%s`\n' "$CANDIDATE_RUN_ID"
            printf -- '- Candidate commit: `%s`\n' "$CANDIDATE_SHA"
            printf -- '- Build workflow commit: `%s`\n' "$WORKFLOW_SHA"
            printf -- '- Acceptance record commit: `%s`\n' "$ACCEPTANCE_COMMIT"
            printf -- '- Verified Windows Setup SHA256: `%s`\n' "$setup_sha256"
            printf -- '- Release body combines the Chinese and English release notes above.\n'
            printf -- '- Assets were downloaded from that candidate run; this promotion does not rebuild them.\n'
          } >> release-body.md
          sha512sum evidence-out/release-plan.json evidence-out/release-acceptance.json | sed 's@evidence-out/@@' >> dist-out/SHA512SUMS.txt

      - name: Re-verify Windows assets immediately before publication
        env:
          EXPECTED_SETUP_SHA256: ${{ inputs.expected_setup_sha256 }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          node scripts/check-release-assets.mjs \
            dist-out "$RELEASE_TAG" "${RELEASE_TAG#v}" "$EXPECTED_SETUP_SHA256"

      - name: Reject an existing tag before publication
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag $RELEASE_TAG already exists; refusing to repoint it." >&2
            exit 1
          fi

      - name: Publish the verified candidate without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.candidate_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          current_tag=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          node scripts/check-release-version.mjs "$RELEASE_TAG" "$current_tag"
          shopt -s nullglob
          assets=(dist-out/Whale-Isle-Setup-*.exe dist-out/Whale-Isle-Setup-*.exe.blockmap macos-out/Whale-Isle-*.dmg dist-out/latest.yml dist-out/SHA512SUMS.txt evidence-out/release-plan.json evidence-out/release-acceptance.json)
          (( ${#assets[@]} >= 4 )) || { echo "Release assets are incomplete" >&2; exit 1; }
          gh release create "$RELEASE_TAG" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$CANDIDATE_SHA" \
            --title "Whale Isle $RELEASE_TAG" \
            --notes-file release-body.md \
            --latest
