version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 30
    labels:
      - "kind/dependency"
      - "area/infra"
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 30
    labels:
      - "kind/dependency"
      - "area/infra"
    open-pull-requests-limit: 5
