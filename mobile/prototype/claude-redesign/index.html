<!DOCTYPE html>
<!--
  PROTOTYPE — throwaway. Not part of mobile/web, not packaged into the APK, not served to phones.
  Question: what should the Android + web remote look like if redesigned after the Claude mobile app?
  Three variants switchable via ?variant=A|B|C (and ?theme=light|dark), fake data only.
    A — Claude 原样：暖纸底 + 衬线标题/正文 + 陶土色标记 + 底部大圆角面板
    B — Claude 结构 + DeepSeek 基线 token：同 A 的结构，换回 --dsw-alias-* 色、无衬线、品牌蓝
    C — 工作台结构（基线 token）：首页即最近会话，无抽屉，贴底输入条，模型/权限整页内联控件
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PROTOTYPE · 手机远程 Claude 风格重设计</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: #d9d9de; color: #111; padding: 24px 24px 120px;
}
.canvas-head { max-width: 1200px; margin: 0 0 20px; }
.canvas-head h1 { margin: 0 0 6px; font-size: 18px; line-height: 26px; }
.canvas-head p { margin: 0; font-size: 13px; line-height: 20px; color: #444; }
.rail { display: flex; gap: 28px; overflow-x: auto; padding-bottom: 12px; align-items: flex-start; }
.cell { flex: none; display: flex; flex-direction: column; gap: 10px; }
.cell-label { font-size: 12px; line-height: 18px; color: #333; font-weight: 600; }
.cell-note { font-size: 11px; line-height: 16px; color: #555; max-width: 360px; }

/* ———————————————— Theme tables (prototype-only, per variant) ———————————————— */
.phone {
  --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --font-display: var(--font-body);
  --font-answer: var(--font-body);
  --display-weight: 600;
  --mono: 'SF Mono', 'JetBrains Mono', Consolas, monospace;
}
/* A: Claude-faithful warm paper */
.v-A.light {
  --bg: #FAF9F5; --surface: #FFFFFF; --surface-2: #F0EEE6; --surface-3: #E8E6DC;
  --text: #1F1E1D; --text-2: #5E5D59; --text-3: #8A8984;
  --border: rgba(31,30,29,.08); --border-2: rgba(31,30,29,.14);
  --primary: #1F1E1D; --on-primary: #FFFFFF; --mark: #D97757; --select: #2F5FB3;
  --badge-bg: #E3ECFA; --badge: #2F5FB3; --ok: #3D8B4F; --warn-bg: #F7EEDC; --warn: #9A6212;
  --mask: rgba(20,20,19,.32); --shadow: 0 1px 2px rgba(0,0,0,.04), 0 6px 20px rgba(0,0,0,.06);
}
.v-A.dark {
  --bg: #262624; --surface: #30302E; --surface-2: #3A3A37; --surface-3: #454541;
  --text: #F5F4EE; --text-2: #C3C2B7; --text-3: #8F8E86;
  --border: rgba(255,255,255,.07); --border-2: rgba(255,255,255,.12);
  --primary: #F5F4EE; --on-primary: #1F1E1D; --mark: #D97757; --select: #8FB2F0;
  --badge-bg: #2D3A52; --badge: #A9C3F2; --ok: #7CC48C; --warn-bg: #3B3222; --warn: #E3B066;
  --mask: rgba(0,0,0,.5); --shadow: 0 1px 2px rgba(0,0,0,.2), 0 6px 20px rgba(0,0,0,.25);
}
.v-A {
  --font-display: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', 'STSong', Georgia, serif;
  --font-answer: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', 'STSong', Georgia, serif;
  --display-weight: 500;
}
/* B + C: DeepSeek baseline values (mirror mobile/web/tokens.css) */
.v-B.light, .v-C.light {
  --bg: rgb(249,250,251); --surface: rgb(255,255,255); --surface-2: rgb(241,243,245); --surface-3: rgb(235,238,242);
  --text: rgb(15,17,21); --text-2: rgb(97,102,107); --text-3: rgb(129,133,140);
  --border: rgba(0,0,0,.04); --border-2: rgba(0,0,0,.10);
  --primary: rgb(15,17,21); --on-primary: #fff; --mark: rgb(65,118,230); --select: rgb(65,118,230);
  --badge-bg: rgb(228,237,253); --badge: rgb(65,118,230); --ok: rgb(34,197,94); --warn-bg: rgb(254,245,231); --warn: rgb(245,158,11);
  --mask: rgba(0,0,0,.24); --shadow: 0 4px 12px rgba(0,0,0,.02), 0 2px 8px rgba(0,0,0,.04);
}
.v-B.dark, .v-C.dark {
  --bg: rgb(21,21,23); --surface: rgb(35,35,36); --surface-2: rgb(44,44,46); --surface-3: rgb(53,54,56);
  --text: rgb(249,250,251); --text-2: rgb(207,211,214); --text-3: rgb(173,178,184);
  --border: rgba(255,255,255,.06); --border-2: rgba(255,255,255,.12);
  --primary: rgb(249,250,251); --on-primary: rgb(15,17,21); --mark: rgb(103,158,254); --select: rgb(103,158,254);
  --badge-bg: rgb(53,54,56); --badge: rgb(103,158,254); --ok: rgb(34,197,94); --warn-bg: rgb(39,36,31); --warn: rgb(247,173,49);
  --mask: rgba(0,0,0,.5); --shadow: 0 4px 12px rgba(0,0,0,.2);
}

/* ———————————————— Phone shell ———————————————— */
.phone {
  position: relative; width: 360px; height: 760px; overflow: hidden;
  border-radius: 28px; background: var(--bg); color: var(--text);
  font-family: var(--font-body); font-size: 15px; line-height: 22px;
  box-shadow: 0 0 0 8px #111, 0 20px 40px rgba(0,0,0,.25);
  display: flex; flex-direction: column;
}
.status { flex: none; height: 32px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; font-size: 12px; font-weight: 600; }
.status span:last-child { letter-spacing: 1px; }
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; }
.ic { width: 20px; height: 20px; flex: none; }
.ic-sm { width: 16px; height: 16px; flex: none; }
.hit { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 12px; }
.hit:hover { background: var(--surface-2); }

.topbar { flex: none; height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 6px; }
.topbar-title { font-family: var(--font-display); font-weight: var(--display-weight); font-size: 18px; line-height: 26px; }
.topbar-right { display: flex; }

/* Hero (empty draft) */
.hero { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 0 32px; text-align: center; }
.hero-mark { width: 44px; height: 44px; color: var(--mark); }
.hero h2 { margin: 0; font-family: var(--font-display); font-weight: var(--display-weight); font-size: 26px; line-height: 34px; }
.v-B .hero h2 { font-size: 22px; line-height: 30px; }
.hero-sub { font-size: 13px; line-height: 20px; color: var(--text-3); }
.ws-chip { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 16px; background: var(--surface-2); font-size: 13px; color: var(--text-2); }

/* Floating composer card (A/B) */
.composer {
  flex: none; margin: 0 10px 10px; border-radius: 24px; background: var(--surface);
  border: 1px solid var(--border-2); box-shadow: var(--shadow); padding: 8px;
}
.strip { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px; border-radius: 14px; background: var(--surface-2); font-size: 13px; color: var(--text-2); }
.strip b { font-weight: 500; color: var(--text); }
.strip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex: none; }
.strip .act { margin-left: auto; color: var(--select); font-weight: 500; }
.draft { padding: 12px 8px 10px; font-size: 16px; line-height: 24px; color: var(--text-3); }
.draft.filled { color: var(--text); }
.c-row { display: flex; align-items: center; gap: 8px; }
.round { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); flex: none; }
.pill { height: 40px; padding: 0 14px; border-radius: 20px; display: inline-flex; align-items: center; gap: 6px; background: var(--surface-2); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.pill .sub { color: var(--text-3); }
.send { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--primary); color: var(--on-primary); flex: none; }
.spacer { flex: 1; }

/* Drawer */
.overlay { position: absolute; inset: 0; background: var(--mask); }
.drawer {
  position: absolute; inset: 0 auto 0 0; width: 300px; background: var(--bg);
  border-radius: 0 24px 24px 0; display: flex; flex-direction: column; padding: 32px 0 16px;
}
.drawer-brand { padding: 20px 24px 16px; font-family: var(--font-display); font-weight: var(--display-weight); font-size: 26px; line-height: 34px; display: flex; align-items: center; gap: 10px; }
.v-B .drawer-brand { font-size: 20px; }
.drawer-brand svg { color: var(--mark); width: 24px; height: 24px; }
.nav { display: flex; align-items: center; gap: 16px; height: 52px; padding: 0 24px; font-size: 16px; }
.nav:hover { background: var(--surface-2); }
.nav .count { margin-left: auto; font-size: 12px; color: var(--text-3); }
.divider { height: 1px; margin: 8px 16px; background: var(--border-2); }
.sec { padding: 12px 24px 6px; font-size: 14px; color: var(--text-3); }
.recent { display: flex; align-items: flex-start; gap: 14px; padding: 10px 24px; }
.recent .bullet { margin-top: 8px; width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid var(--text-3); flex: none; }
.recent .bullet.run { border-color: var(--select); background: var(--select); }
.recent .r-main { min-width: 0; }
.recent .r-title { font-size: 15px; line-height: 22px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.recent .r-sub { font-size: 12px; line-height: 16px; color: var(--text-3); }
.recent.active { background: var(--surface-2); }
.drawer-foot { margin-top: auto; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; }
.avatar { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--mark); color: #fff; font-size: 15px; font-weight: 600; }
.new-btn { height: 48px; padding: 0 22px; border-radius: 24px; background: var(--primary); color: var(--on-primary); display: inline-flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 500; }

/* Conversation */
.convo { flex: 1; min-height: 0; overflow: hidden; padding: 4px 18px 12px; display: flex; flex-direction: column; gap: 14px; }
.git { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 16px; border: 1px solid var(--border-2); font-size: 13px; color: var(--text-2); }
.git b { color: var(--text); font-weight: 500; }
.u { align-self: flex-end; max-width: 82%; padding: 10px 14px; border-radius: 20px; background: var(--surface-2); }
.a { font-family: var(--font-answer); font-size: 16px; line-height: 27px; }
.v-B .a, .v-C .a { font-size: 15px; line-height: 24px; }
.a p { margin: 0 0 8px; }
.a code { font-family: var(--mono); font-size: 13px; padding: 1px 5px; border-radius: 5px; background: var(--surface-2); }
.flow { display: flex; flex-direction: column; gap: 2px; }
.f-row { display: flex; align-items: center; gap: 8px; height: 30px; font-size: 13px; color: var(--text-2); font-family: var(--font-body); }
.f-row .ic-sm { color: var(--text-3); }
.f-row .f-sum { color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.f-row .ok { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); margin-left: auto; flex: none; }
.approval { flex: none; margin: 0 10px 10px; border-radius: 24px; background: var(--surface); border: 1px solid var(--border-2); box-shadow: var(--shadow); overflow: hidden; }
.approval .ap-head { display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: var(--warn-bg); color: var(--warn); font-size: 13px; font-weight: 500; }
.approval .ap-body { padding: 12px 16px 4px; }
.approval .ap-cmd { font-family: var(--mono); font-size: 13px; line-height: 20px; color: var(--text-2); padding: 8px 10px; border-radius: 10px; background: var(--surface-2); margin-top: 6px; }
.approval .ap-actions { display: flex; gap: 8px; padding: 12px 16px 14px; justify-content: flex-end; }
.btn { height: 40px; padding: 0 18px; border-radius: 20px; font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; justify-content: center; }
.btn.primary { background: var(--primary); color: var(--on-primary); }
.btn.ghost { border: 1px solid var(--border-2); }
.btn.block { width: 100%; height: 48px; border-radius: 24px; font-size: 16px; }

/* Bottom sheet (A/B model picker) */
.sheet { position: absolute; left: 0; right: 0; bottom: 0; background: var(--bg); border-radius: 28px 28px 0 0; padding: 8px 12px 18px; }
.sheet-head { display: flex; align-items: center; height: 52px; }
.sheet-head .t { flex: 1; text-align: center; font-family: var(--font-display); font-weight: var(--display-weight); font-size: 18px; margin-right: 44px; }
.card { background: var(--surface); border-radius: 18px; border: 1px solid var(--border); overflow: hidden; }
.card + .card { margin-top: 10px; }
.m-row { display: flex; align-items: center; gap: 12px; padding: 12px 16px; }
.m-row + .m-row { border-top: 1px solid var(--border); }
.m-name { font-size: 16px; line-height: 24px; display: flex; align-items: center; gap: 8px; }
.m-desc { font-size: 13px; line-height: 20px; color: var(--text-3); }
.m-row.sel .m-name, .m-row.sel .m-desc { color: var(--select); }
.m-row .check { margin-left: auto; color: var(--select); }
.badge { font-size: 11px; line-height: 18px; padding: 0 8px; border-radius: 9px; background: var(--badge-bg); color: var(--badge); }
.drill { display: flex; align-items: center; gap: 14px; padding: 12px 16px; }
.drill .round { width: 40px; height: 40px; }
.drill .d-main { flex: 1; min-width: 0; }
.drill .d-t { font-size: 16px; line-height: 24px; }
.drill .d-v { font-size: 13px; line-height: 20px; color: var(--select); }
.drill .d-v.muted { color: var(--text-3); }
.chev { color: var(--text-3); }

/* Settings */
.scroll { flex: 1; min-height: 0; overflow: hidden; padding: 4px 14px 16px; display: flex; flex-direction: column; gap: 12px; }
.scroll > * { flex: none; }
.ahead { display: inline-flex; align-items: center; gap: 1px; color: var(--text-3); }
.ahead svg { width: 12px; height: 12px; }
.acct { display: flex; align-items: center; justify-content: space-between; padding: 16px; }
.acct b { font-weight: 500; font-size: 15px; }
.tag-dark { font-size: 12px; font-weight: 600; padding: 2px 10px; border-radius: 10px; background: var(--primary); color: var(--on-primary); }
.promo { padding: 18px 18px 16px; }
.promo h3 { margin: 0 0 4px; font-size: 17px; line-height: 24px; font-weight: 600; }
.promo p { margin: 0 0 12px; font-size: 14px; line-height: 21px; color: var(--text-2); }
.promo .btn { height: 36px; }
.s-row { display: flex; align-items: center; gap: 14px; padding: 13px 16px; }
.s-row + .s-row { border-top: 1px solid var(--border); }
.s-row .ic { color: var(--text-2); }
.s-row .s-main { flex: 1; min-width: 0; }
.s-row .s-t { font-size: 16px; line-height: 24px; }
.s-row .s-v { font-size: 13px; line-height: 18px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.s-row.danger .s-t, .s-row.danger .ic { color: rgb(220,60,60); }
.toggle { width: 44px; height: 26px; border-radius: 13px; background: var(--select); position: relative; flex: none; }
.toggle::after { content: ""; position: absolute; top: 3px; right: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; }

/* Connect */
.connect { flex: 1; display: flex; flex-direction: column; padding: 0 22px 20px; }
.connect-hero { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center; }
.connect-hero h2 { margin: 0; font-family: var(--font-display); font-weight: var(--display-weight); font-size: 26px; line-height: 34px; }
.v-B .connect-hero h2 { font-size: 22px; line-height: 30px; }
.connect-hero p { margin: 0; font-size: 14px; line-height: 21px; color: var(--text-2); max-width: 280px; }
.saved-t { font-size: 13px; color: var(--text-3); padding: 0 4px 6px; }
.saved { display: flex; align-items: center; gap: 12px; padding: 12px 14px; }
.saved .pc { width: 36px; height: 36px; border-radius: 10px; background: var(--surface-2); display: grid; place-items: center; color: var(--text-2); }
.saved .s-main { flex: 1; min-width: 0; }
.saved .s-t { font-size: 15px; line-height: 22px; }
.saved .s-v { font-size: 12px; line-height: 16px; color: var(--text-3); }
.foot-note { text-align: center; font-size: 12px; line-height: 18px; color: var(--text-3); margin-top: 12px; }
.connecting { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-2); }
.spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--border-2); border-top-color: var(--text); }

/* ———————————————— Variant C (workbench structure) ———————————————— */
.c-top { flex: none; height: 56px; display: flex; align-items: center; gap: 4px; padding: 0 6px 0 14px; }
.pc-switch { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px; border-radius: 18px; background: var(--surface); border: 1px solid var(--border-2); font-size: 14px; font-weight: 500; }
.pc-switch .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
.c-greet { padding: 8px 20px 4px; }
.c-greet h2 { margin: 0; font-size: 22px; line-height: 30px; font-weight: 600; }
.c-greet p { margin: 2px 0 0; font-size: 13px; color: var(--text-3); }
.chips { display: flex; gap: 8px; padding: 12px 20px 4px; overflow: hidden; }
.chip { flex: none; height: 34px; padding: 0 14px; border-radius: 17px; background: var(--surface); border: 1px solid var(--border-2); display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-2); }
.chip.on { background: var(--primary); color: var(--on-primary); border-color: transparent; }
.c-list { flex: 1; min-height: 0; overflow: hidden; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.s-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; }
.s-card .h { display: flex; align-items: center; gap: 8px; }
.s-card .t { font-size: 15px; line-height: 22px; font-weight: 500; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.s-card .time { font-size: 12px; color: var(--text-3); flex: none; }
.s-card .p { font-size: 13px; line-height: 19px; color: var(--text-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.s-card .meta { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-3); }
.s-card .run { color: var(--select); font-weight: 500; }
.s-card .wait { color: var(--warn); font-weight: 500; }
.dock { flex: none; background: var(--surface); border-top: 1px solid var(--border-2); padding: 10px 12px 12px; }
.dock .field { display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 6px 0 16px; border-radius: 22px; background: var(--surface-2); font-size: 16px; color: var(--text-3); }
.dock .field .send { width: 34px; height: 34px; margin-left: auto; }
.dock .tools { display: flex; align-items: center; gap: 6px; padding-top: 8px; }
.tool { flex: none; height: 32px; padding: 0 10px; border-radius: 16px; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-2); white-space: nowrap; }
.tool.shrink { flex: 0 1 auto; min-width: 0; overflow: hidden; }
.tool.icon { padding: 0; width: 32px; justify-content: center; }
.tool:hover { background: var(--surface-2); }
.c-head { flex: none; display: flex; align-items: center; gap: 2px; padding: 4px 6px 8px 2px; border-bottom: 1px solid var(--border); }
.c-head .h-main { flex: 1; min-width: 0; }
.c-head .h-t { font-size: 16px; line-height: 22px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.c-head .h-s { display: flex; align-items: center; gap: 6px; font-size: 12px; line-height: 18px; color: var(--text-3); }
.search { margin: 4px 14px 8px; height: 44px; border-radius: 22px; background: var(--surface); border: 1px solid var(--border-2); display: flex; align-items: center; gap: 10px; padding: 0 16px; color: var(--text-3); font-size: 15px; }
.seg { display: flex; margin: 0 14px 8px; padding: 3px; border-radius: 14px; background: var(--surface-2); }
.seg > span { flex: 1; height: 34px; border-radius: 11px; display: grid; place-items: center; font-size: 14px; color: var(--text-2); }
.seg > span.on { background: var(--surface); color: var(--text); font-weight: 500; box-shadow: var(--shadow); }
.grp-h { display: flex; align-items: center; gap: 8px; padding: 10px 6px 4px; font-size: 13px; color: var(--text-3); }
.grp-h b { color: var(--text-2); font-weight: 600; }
.grp-h .n { margin-left: auto; }
.row-flat { display: flex; align-items: center; gap: 12px; padding: 11px 14px; }
.row-flat + .row-flat { border-top: 1px solid var(--border); }

    <div class="card">${row(I.plug, 'MCP 与技能', '只读清单 · 电脑端管理')}${row(I.file, '文件', '浏览 · 只读预览')}${row(I.info, '关于', 'Deepseek-Harness-Desktop')}</div>
    <div class="card"><div class="s-row danger">${I.logout}<span class="s-main"><div class="s-t">断开这台设备</div></span></div></div>
  </div>`);
}

// ———————————————— Variant table ————————————————

// ———————————————— Switcher ————————————————
const params = new URLSearchParams(location.search);
delete VARIANTS.A; // Verdict 1: keep DSHD light/dark tokens, drop the Claude palette.
let VARIANT = VARIANTS[params.get('variant')] ? params.get('variant') : 'B';
let THEME = params.get('theme') === 'dark' ? 'dark' : 'light';
let REF = params.get('ref') === '1';
const KEYS = Object.keys(VARIANTS);

function render() {
  const v = VARIANTS[VARIANT];
  document.getElementById('head-title').textContent = `PROTOTYPE · 变体 ${VARIANT} — ${v.name}`;
  document.getElementById('head-desc').textContent = v.desc;
  document.getElementById('bar-label').textContent = `${VARIANT} — ${v.name} · ${THEME === 'dark' ? '深色' : '浅色'}`;
  document.getElementById('ref').textContent = REF ? '隐藏 Claude 对照' : '对照 Claude';
  document.getElementById('rail').innerHTML = v.screens.map(([label, fn, note, ref]) => {
    const refImg = REF && ref ? `<img class="ref" src="./ref/${ref}.jpg" alt="Claude ${ref}" />` : '';
    return `<div class="cell"><div class="cell-label">${label}${refImg ? ' · 左：原型 / 右：Claude' : ''}</div><div class="pair">${fn(VARIANT)}${refImg}</div>${note ? `<div class="cell-note">${note}</div>` : ''}</div>`;
  }).join('');
}
function go(delta) {
  VARIANT = KEYS[(KEYS.indexOf(VARIANT) + delta + KEYS.length) % KEYS.length];
  sync();
}
function sync() {
  const q = new URLSearchParams({ variant: VARIANT, theme: THEME, ref: REF ? '1' : '0' });
  history.replaceState(null, '', `?${q}`);
  render();
}
document.getElementById('prev').onclick = () => go(-1);
document.getElementById('next').onclick = () => go(1);
document.getElementById('theme').onclick = () => { THEME = THEME === 'dark' ? 'light' : 'dark'; sync(); };
document.getElementById('ref').onclick = () => { REF = !REF; sync(); };
document.addEventListener('keydown', (e) => {
  if (e.target.closest('input, textarea, [contenteditable]')) return;
  if (e.key === 'ArrowLeft') go(-1);
  if (e.key === 'ArrowRight') go(1);
});
render();
</script>
