<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Whale Isle · 手机远程</title>
    <link rel="stylesheet" href="./tokens.css?v=20260907-desktop-mobile" />
    <link rel="stylesheet" href="./app.css?v=20260907-desktop-mobile" />
</head>
<body>
  <div class="phone" id="phone">
    <section class="screen connect" id="screen-connect">
      <div class="connect-hero">
        <svg class="whale-mark" viewBox="0 0 48 48" fill="none" aria-hidden="true"><path d="M6 27c0-8.3 7.6-15 17-15 7 0 12.5 3.6 15 9 2.3-.9 4.2-2.6 5.2-4.8.8 4-1 8-4.3 10.2C36.6 33.2 30.6 37 23 37 13.6 37 6 33.3 6 27Z" fill="currentColor"/><circle cx="16" cy="24" r="1.8" fill="var(--dsw-specific-sidebar-fill)"/></svg>
        <h2>连接到这台电脑</h2>
        <p class="lead">在电脑端账户菜单打开「远程」，扫描弹窗里的二维码。</p>
        <div class="device" id="device-line"><span class="live"></span>等待配对</div>
        <p class="error hidden" id="connect-error"></p>
      </div>
      <div class="saved-computers hidden" id="saved-computers"></div>
      <button class="primary-btn hidden" type="button" id="scan-open">扫描二维码</button>
      <p class="row-desc hidden" id="scan-unavailable"></p>
      <input class="paste" id="paste" type="url" placeholder="http://…/#offer=…" autocomplete="off" />
      <button class="ghost-btn" type="button" id="paste-enter">用链接连接</button>
      <div class="connect-notes">
        <p class="row-desc" id="entry-split-hint">用相机 / 浏览器扫码打开本页＝web 端；装了 Android App 的话，在 App 内扫同一张码＝链接设备。</p>
        <p class="row-desc">完整链接必须带 #offer=；微信 / QQ 打开会丢掉密钥，请改用系统相机或粘贴整段。</p>
      </div>
    </section>

    <section class="screen scan hidden" id="screen-scan">
      <div class="scan-stage">
        <video id="scan-video" playsinline muted autoplay></video>
        <div class="scan-frame" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      </div>
      <p class="scan-tip" id="scan-tip">将二维码放入框内</p>
      <div class="scan-actions">
        <button class="ghost-btn" type="button" id="scan-cancel">取消</button>
        <button class="primary-btn hidden" type="button" id="scan-torch">手电筒</button>
      </div>
    </section>

    <section class="screen connect hidden" id="screen-permission">
      <div class="connect-hero">
        <svg class="whale-mark" viewBox="0 0 48 48" fill="none" aria-hidden="true"><path d="M6 27c0-8.3 7.6-15 17-15 7 0 12.5 3.6 15 9 2.3-.9 4.2-2.6 5.2-4.8.8 4-1 8-4.3 10.2C36.6 33.2 30.6 37 23 37 13.6 37 6 33.3 6 27Z" fill="currentColor"/><circle cx="16" cy="24" r="1.8" fill="var(--dsw-specific-sidebar-fill)"/></svg>
        <h2>需要相机权限</h2>
        <p class="lead">扫码要用相机。浏览器拒绝了相机权限；请在浏览器的站点设置里允许本站使用相机，或改用粘贴配对链接。</p>
      </div>
      <button class="ghost-btn" type="button" id="permission-paste">改用粘贴链接</button>
    </section>

    <section class="screen chat hidden" id="screen-chat">
      <header class="topbar">
        <button class="icon-btn topbar-btn" type="button" id="menu" aria-label="打开会话列表">
          <svg width="18" height="18" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M3 5.5h14M3 10h10M3 14.5h14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
        <div class="topbar-center">
          <button class="git-pill hidden" type="button" id="git-pill" aria-label="打开 Git 菜单">
            <svg class="git-pill-icon" width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="4.5" cy="3.5" r="1.5" stroke="currentColor" stroke-width="1.3"/><circle cx="4.5" cy="12.5" r="1.5" stroke="currentColor" stroke-width="1.3"/><circle cx="11.5" cy="5" r="1.5" stroke="currentColor" stroke-width="1.3"/><path d="M4.5 5v6M11.5 6.5c0 2.5-2 3.5-7 4.5" stroke="currentColor" stroke-width="1.3"/></svg>
            <span class="git-pill-label" id="git-pill-label"></span>
            <span class="git-pill-count" id="git-pill-count"></span>
            <svg class="git-pill-chevron" width="12" height="12" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="m4 6 4 4 4-4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <h2 class="title" id="chat-title">新会话</h2>
        </div>
        <span class="meta-host sr-only" id="host-line">Whale Isle</span>
        <button class="icon-btn topbar-btn" type="button" id="new-chat-top" aria-label="新会话">
          <svg width="18" height="18" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M10 3.5H5.5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h9a2 2 0 0 0 2-2V10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="m9 11 7-7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
      </header>
      <p class="conn-banner hidden" id="conn-banner" role="status"></p>
      <p class="banner hidden" id="banner"></p>
      <div class="log" id="log"></div>
      <div class="blank" id="blank">
        <svg class="whale-mark" viewBox="0 0 48 48" fill="none" aria-hidden="true"><path d="M6 27c0-8.3 7.6-15 17-15 7 0 12.5 3.6 15 9 2.3-.9 4.2-2.6 5.2-4.8.8 4-1 8-4.3 10.2C36.6 33.2 30.6 37 23 37 13.6 37 6 33.3 6 27Z" fill="currentColor"/><circle cx="16" cy="24" r="1.8" fill="var(--dsw-specific-sidebar-fill)"/></svg>
        <h2 id="blank-greeting"></h2>
        <button class="ws-chip hidden" type="button" id="blank-workspace-chip">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M2 4.5A1.5 1.5 0 0 1 3.5 3h3.1a1 1 0 0 1 .7.3l1 1a1 1 0 0 0 .7.3h3.5A1.5 1.5 0 0 1 14 6.1v5.4a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 2 11.5v-7Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
          <span class="ws-chip-label" id="blank-workspace-chip-label">工作区</span>
          <svg width="12" height="12" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="m4 6 4 4 4-4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <div class="composer-root">
        <div class="slash-pop hidden" id="slash-pop"></div>
        <p class="readonly-note hidden" id="readonly-note"></p>
        <form class="composer" id="composer">
          <div class="beam-layer" aria-hidden="true">
            <span class="beam-inner"></span>
            <span class="beam-stroke"></span>
            <span class="beam-bloom"></span>
          </div>
          <div class="attach-rail hidden" id="attach-rail"></div>
          <textarea id="draft" rows="2" placeholder="给智能体发消息"></textarea>
          <div class="composer-row">
            <button class="icon-btn composer-round" type="button" id="attach-toggle" aria-label="添加附件">
              <svg width="16" height="16" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M10 4v12M4 10h12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
            </button>
            <button class="chip chip-shrink" type="button" id="model-chip"><span class="chip-label">模型</span></button>
            <span class="composer-spacer"></span>
            <button class="chip hidden" type="button" id="plan-chip">计划</button>
            <button class="icon-btn composer-round" type="button" id="access-chip" aria-label="权限">
              <span class="chip-label sr-only">权限</span>
              <svg width="16" height="16" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M10 2.5 4 5v4.5c0 3.6 2.6 6.6 6 8 3.4-1.4 6-4.4 6-8V5l-6-2.5Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
            </button>
            <button class="send" type="submit" id="send-btn" aria-label="发送消息">
              <svg width="16" height="16" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M10 16V4M5 9l5-5 5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <button class="send stop hidden" type="button" id="stop-btn" aria-label="停止运行">
              <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><rect x="1.5" y="1.5" width="9" height="9" rx="2" fill="currentColor"/></svg>
            </button>
          </div>
        </form>
        <div class="approval hidden" id="approval">
          <div class="strip"><span class="dot"></span>等待审批</div>
          <div class="approval-body">
            <p class="headline" id="approval-title">需要审批</p>
            <p class="command" id="approval-command"></p>
            <p class="error" id="approval-error" role="alert"></p>
          </div>
          <div class="action-row" id="approval-actions"></div>
        </div>
      </div>
    </section>

    <button class="backdrop hidden" type="button" id="backdrop" aria-label="关闭会话列表"></button>
    <aside class="drawer" id="drawer">
      <div class="drawer-brand">
        <svg class="whale-mark" viewBox="0 0 48 48" fill="none" aria-hidden="true"><path d="M6 27c0-8.3 7.6-15 17-15 7 0 12.5 3.6 15 9 2.3-.9 4.2-2.6 5.2-4.8.8 4-1 8-4.3 10.2C36.6 33.2 30.6 37 23 37 13.6 37 6 33.3 6 27Z" fill="currentColor"/><circle cx="16" cy="24" r="1.8" fill="var(--dsw-specific-sidebar-fill)"/></svg>
        <h2 tabindex="-1">Whale Isle</h2>
      </div>
      <nav class="drawer-nav">
        <button class="drawer-nav-row" type="button" id="nav-sessions">
          <svg class="nav-icon" width="18" height="18" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M4 14.5 3 17l3.2-1.1A7 7 0 1 0 4 14.5Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
          <span class="nav-label">会话</span><span class="nav-count" id="nav-sessions-count"></span>
        </button>
        <button class="drawer-nav-row" type="button" id="nav-workspace">
          <svg class="nav-icon" width="18" height="18" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M2.5 6a1.5 1.5 0 0 1 1.5-1.5h3.5l2 2H16A1.5 1.5 0 0 1 17.5 8v6.5A1.5 1.5 0 0 1 16 16H4a1.5 1.5 0 0 1-1.5-1.5V6Z" stroke="currentColor" stroke-width="1.4"/></svg>
          <span class="nav-label">工作区</span><span class="nav-count"></span>
        </button>
        <button class="drawer-nav-row" type="button" id="nav-settings">
          <svg class="nav-icon" width="18" height="18" viewBox="0 0 20 20" fill="none" aria-hidden="true"><circle cx="10" cy="10" r="2.6" stroke="currentColor" stroke-width="1.4"/><path d="M10 2.5v2M10 15.5v2M2.5 10h2M15.5 10h2M4.7 4.7l1.4 1.4M13.9 13.9l1.4 1.4M15.3 4.7l-1.4 1.4M6.1 13.9l-1.4 1.4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          <span class="nav-label">设置</span><span class="nav-count"></span>
        </button>
      </nav>
      <div class="drawer-divider" aria-hidden="true"></div>
      <div class="drawer-status" id="drawer-status"></div>
      <p class="drawer-section">最近</p>
      <div class="drawer-recents" id="drawer-recents"></div>
      <div class="drawer-foot">
        <button class="avatar" type="button" id="drawer-account" aria-label="连接详情">电</button>
        <button class="new-session" type="button" id="new-session">＋ 新会话</button>
      </div>
    </aside>

    <section class="sessions-page hidden" id="sessions-page" role="dialog" aria-modal="true" aria-label="会话">
      <div class="set-head">
        <button class="icon-btn" type="button" id="sessions-back" aria-label="返回">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M10 3 5 8l5 5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <h2 id="sessions-title">会话</h2>
        <button class="icon-btn" type="button" id="sessions-new" aria-label="新会话">
          <svg width="16" height="16" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M10 3.5H5.5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h9a2 2 0 0 0 2-2V10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="m9 11 7-7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
      </div>
      <input class="search" id="search" type="search" placeholder="搜索会话" />
      <div class="session-list" id="session-list"></div>
    </section>

    <section class="settings hidden" id="settings" role="dialog" aria-modal="true" aria-label="设置">
      <div class="set-head">
        <button class="icon-btn hidden" type="button" id="settings-back" aria-label="返回">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M10 3 5 8l5 5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="icon-btn" type="button" id="close-settings" aria-label="关闭">
          <svg width="16" height="16" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="m5 5 10 10M15 5 5 15" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
        <h2 id="settings-title">设置</h2>
        <span class="set-head-spacer" aria-hidden="true"></span>
      </div>
      <div class="options" id="options"></div>
    </section>

    <div id="sheet-root"></div>
    <div id="dialog-root"></div>
    <div id="toast-root"></div>
    <div id="lightbox-root"></div>

    <input type="file" accept="image/*" capture="environment" id="file-camera" hidden />
    <input type="file" accept="image/*" multiple id="file-gallery" hidden />
  </div>
    <script type="module" src="./app.js?v=20260907-desktop-mobile"></script>
</body>
</html>
